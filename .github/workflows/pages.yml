name: Deploy prototype to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["apps/web/prototype/**", "packages/contract/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate data against packages/contract
        run: node packages/contract/validate.mjs apps/web/prototype/data --records services/process/samples
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/prototype
      - id: deployment
        uses: actions/deploy-pages@v4
