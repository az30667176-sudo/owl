name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["apps/web/**", "data/**", "packages/contract/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate data against packages/contract
        run: node packages/contract/validate.mjs data --records data/records
      - name: Assemble site (app + contract-B data files)
        run: |
          mkdir -p _site/data
          cp -r apps/web/. _site/
          cp data/taxonomy.json data/issues.json data/people.json data/stances.json _site/data/
          if [ -f data/summaries.json ]; then cp data/summaries.json _site/data/; fi
          if [ -f data/conditions.json ]; then cp data/conditions.json _site/data/; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
