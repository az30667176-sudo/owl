<style>
  /* OWL Night Watch tokens: see the design system (claude.ai/artifact/EpJB5dSQaBEEuKzhToDhF1) */
  :root {
    --bg: #0f1322; --panel: #171c2e; --panel-2: #1f2538; --border: #2c3348; --border-strong: #4a5372;
    --text: #efe6d2; --muted: #aaa493; --faint: #6c6f7d;
    --accent: #f0b429; --on-accent: #1a1200; --parchment: #efe6d2;
    --support: #3fcf77; --oppose: #f2705f; --neutral: #9aa3b2;
    --party-d: #5b8cff; --party-r: #ff7a6b; --party-i: #b9bfcc;
    --ai: #c9b6ff; --ai-wash: #1d1a33;
    --sans: "Public Sans", "Segoe UI", system-ui, sans-serif;
    --display: "Fraunces", "Iowan Old Style", Georgia, serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 var(--sans); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .skip { position: absolute; left: -9999px; top: 0; background: var(--accent); color: var(--on-accent); padding: 8px 14px; z-index: 20; border-radius: 0 0 3px 0; font-weight: 600; }
  .skip:focus { left: 0; }
  h1, .topic-title, .person-card .name, .ph h1, .hero h1 { font-family: var(--display); font-weight: 600; letter-spacing: -.01em; }
  .app { display: grid; grid-template-columns: 280px 1fr 360px; grid-template-rows: 48px 1fr; height: 100vh; }
  header { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; padding: 0 16px; border-bottom: 1px solid var(--border); background: var(--panel); }
  header .brand { font-weight: 700; letter-spacing: .3px; }
  header .crumb { color: var(--muted); font-size: 13px; }
  header .crumb b { color: var(--text); font-weight: 600; }
  .modes { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-left: 8px; }
  .modes button { background: transparent; border: 0; color: var(--muted); padding: 5px 12px; cursor: pointer; font: inherit; font-size: 12px; }
  .modes button.active { background: var(--accent); color: var(--on-accent); }
  header .mock { margin-left: auto; font-size: 11px; padding: 3px 8px; border: 1px solid var(--accent); color: var(--accent); border-radius: 999px; }
  header .drop { font-size: 11px; padding: 3px 8px; border: 1px solid var(--border-strong); color: var(--muted); border-radius: 999px; }
  aside, section, .side { overflow: auto; }
  aside { border-right: 1px solid var(--border); background: var(--panel); padding: 10px 12px 24px; }
  .h { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 14px 4px 6px; display: flex; justify-content: space-between; }
  .h a { color: var(--accent); cursor: pointer; text-transform: none; letter-spacing: 0; font-size: 11px; }
  .cat { padding: 7px 10px; border-radius: 8px; cursor: pointer; color: var(--text); display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
  .cat:hover { background: var(--panel-2); }
  .cat.active { background: rgba(240,180,41,.14); color: var(--accent); }
  .cat .n { color: var(--muted); font-size: 12px; }
  .subs { display: flex; flex-wrap: wrap; gap: 6px; padding: 2px 4px 4px; }
  .chip { font-size: 12px; padding: 4px 10px; border: 1px solid var(--border); border-radius: 999px; cursor: pointer; color: var(--muted); user-select: none; }
  .chip:hover { border-color: var(--accent); color: var(--text); }
  .chip.active { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .chip.empty { opacity: .4; cursor: default; }
  .chip.d.active { background: var(--party-d); border-color: var(--party-d); color: #06112b; }
  .chip.r.active { background: var(--party-r); border-color: var(--party-r); color: #2b0906; }
  .chip.support.active { background: var(--support); border-color: var(--support); color: #04200f; }
  .chip.oppose.active { background: var(--oppose); border-color: var(--oppose); color: #2b0906; }
  .chip.neutral.active { background: var(--neutral); border-color: var(--neutral); color: #111; }
  .search, .field select { width: 100%; background: var(--panel-2); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 7px 10px; font: inherit; font-size: 13px; outline: none; }
  .search:focus, .field select:focus { border-color: var(--accent); }
  .field { margin: 0 4px 10px; }
  .field label { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px; }
  .group { margin: 4px 4px 0; }
  .group .gh { display: flex; align-items: center; gap: 8px; padding: 6px 6px; border-radius: 8px; cursor: pointer; }
  .group .gh:hover { background: var(--panel-2); }
  .group .gh .sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .group .gh .name { flex: 1; font-weight: 600; font-size: 13px; }
  .group .gh .n { color: var(--muted); font-size: 11px; }
  .group .gh input { accent-color: var(--accent); }
  .group .subl { font-size: 11px; color: var(--muted); padding: 4px 0 2px 24px; }
  .group .subs { padding-left: 24px; }
  .stat { font-size: 12px; color: var(--muted); margin: 10px 4px 0; }
  section { position: relative; }
  #main { overflow: hidden; }
  svg { width: 100%; height: 100%; display: block; }
  .legend { position: absolute; left: 14px; bottom: 12px; display: flex; gap: 14px; font-size: 12px; color: var(--muted); background: rgba(23,26,33,.85); padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
  .hint { font-size: 12px; color: var(--muted); padding: 12px 14px 0; }
  .hint:empty { display: none; }
  .side { border-left: 1px solid var(--border); background: var(--panel); padding: 14px; }
  .topic-title { font-size: 18px; font-weight: 700; margin: 0 0 2px; }
  .topic-sub { color: var(--muted); font-size: 12px; margin-bottom: 12px; }
  .iwrap { max-width: 1180px; }
  .row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 8px 8px; border-radius: 8px; cursor: pointer; }
  .row:hover, .row.active { background: var(--panel-2); }
  .row .name { font-weight: 600; }
  .row .meta { color: var(--muted); font-size: 12px; }
  .bar { height: 6px; border-radius: 999px; background: var(--border); position: relative; margin-top: 5px; overflow: hidden; }
  .bar > span { position: absolute; top: 0; bottom: 0; }
  .score { font-family: var(--mono); font-size: 12px; min-width: 44px; text-align: right; }
  .evidence { margin-top: 14px; padding: 12px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px; }
  .evidence blockquote { margin: 8px 0; padding-left: 10px; border-left: 3px solid var(--accent); color: var(--text); font-family: var(--display); font-style: italic; font-size: 15px; line-height: 24px; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .tag { font-size: 11px; padding: 2px 7px; border-radius: 6px; border: 1px solid var(--border); color: var(--muted); font-family: var(--mono); }
  .tag.c-high, .tag.c-super_high { border-color: var(--support); color: var(--support); }
  .tag.c-mid { border-color: var(--accent); color: var(--accent); }
  .tag.c-low { border-color: var(--oppose); color: var(--oppose); }
  .evidence a { color: var(--accent); font-size: 12px; }
  .empty-state { color: var(--muted); padding: 20px 8px; }
  .ih1 { font-family: var(--display); font-weight: 600; font-size: 24px; margin: 6px 0 4px; }
  .person-card { padding: 10px 8px; border-radius: 8px; }
  .person-card .name { font-weight: 700; font-size: 16px; }
  .person-card .meta { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
  .stance-line { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 6px 8px; border-radius: 8px; cursor: pointer; }
  .stance-line:hover, .stance-line.active { background: var(--panel-2); }
  .stance-line .t { font-size: 13px; }
  .stance-line .c { font-size: 11px; color: var(--muted); }
  .btn { background: var(--panel-2); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 5px 10px; font: inherit; font-size: 12px; cursor: pointer; }
  .btn:hover { border-color: var(--accent); }
  #table-wrap { position: absolute; inset: 0; overflow: auto; padding: 14px; display: none; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { position: sticky; top: 0; background: var(--panel); color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; cursor: pointer; user-select: none; }
  th.sorted { color: var(--text); }
  tbody tr { cursor: pointer; }
  tbody tr:hover, tbody tr.active { background: var(--panel-2); }
  td.quote { max-width: 320px; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .pill.D { background: rgba(91,140,255,.2); color: var(--party-d); } .pill.R { background: rgba(255,122,107,.2); color: var(--party-r); } .pill.I { background: rgba(185,191,204,.2); color: var(--party-i); }
  .pill.support { background: rgba(63,207,119,.18); color: var(--support); } .pill.oppose { background: rgba(242,112,95,.18); color: var(--oppose); } .pill.neutral { background: rgba(154,163,178,.18); color: var(--neutral); }
  .pill.house { background: rgba(240,180,41,.18); color: var(--accent); } .pill.senate { background: rgba(245,158,11,.18); color: var(--accent); }
  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; color: var(--muted); font-size: 12px; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); color: var(--muted); z-index: 10; }
  /* profile mode */
  #profile { position: absolute; inset: 0; overflow: auto; padding: 18px 22px 30px; display: none; }
  .ph { display: flex; gap: 18px; align-items: flex-start; margin-bottom: 18px; }
  .ph .avatar { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 22px; color: white; flex: none; }
  .ph h1 { margin: 0; font-size: 22px; }
  .ph .meta { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .ph .kpis { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
  .kpi { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; min-width: 92px; }
  .kpi .v { font-size: 18px; font-weight: 700; font-family: var(--mono); }
  .kpi .l { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .pgrid { display: grid; grid-template-columns: 1fr 300px; gap: 18px; align-items: start; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px; }
  .card h3 { margin: 0 0 4px; font-size: 14px; }
  .card .sub { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
  .pbar-row { cursor: pointer; }
  .pbar-row:hover rect.bg, .pbar-row.active rect.bg { fill: var(--panel-2); }
  /* profile overview: ranked attention bars + committee mix (hairlines, no nested cards) */
  .attn-row { display: grid; grid-template-columns: 10px minmax(0,1.15fr) minmax(50px,.85fr) auto auto; gap: 10px; align-items: center; padding: 6px 8px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .attn-row:hover, .attn-row.active { background: var(--panel-2); }
  .attn-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .attn-name { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .attn-cond { color: var(--accent); font-size: 12px; }
  .attn-barwrap { height: 8px; background: var(--border); border-radius: 3px; overflow: hidden; }
  .attn-bar { display: block; height: 8px; border-radius: 3px; }
  .attn-n { color: var(--muted); font-size: 12px; font-family: var(--mono); }
  .mix-bar { display: flex; height: 14px; border-radius: 3px; overflow: hidden; background: var(--border); }
  .mix-bar i { display: block; height: 14px; }
  .mix-leg { display: flex; flex-direction: column; gap: 5px; margin-top: 10px; font-size: 12px; color: var(--muted); }
  .mix-leg .mrow { display: flex; align-items: center; gap: 8px; }
  .mix-leg .mdot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .mix-nums { display: flex; gap: 28px; margin-top: 12px; border-top: 1px solid var(--border); padding-top: 10px; }
  .mix-nums .v { font: 700 16px var(--mono); }
  .mix-nums .l { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-top: 2px; }
  .dir-list { display: flex; flex-direction: column; gap: 4px; margin-top: 4px; }
  .dir-row { display: flex; justify-content: space-between; align-items: center; padding: 7px 8px; border-radius: 8px; cursor: pointer; }
  .dir-row:hover, .dir-row.active { background: var(--panel-2); }
  .dir-row .n { font-weight: 600; font-size: 13px; }
  .dir-row .d { color: var(--muted); font-size: 11px; }
  .link { color: var(--accent); cursor: pointer; font-size: 12px; }
  @media (max-width: 1100px) { .pgrid { grid-template-columns: 1fr; } }
  /* profile v2 */
  .hero { display: grid; grid-template-columns: 56px minmax(260px, 1fr) auto; gap: 16px; align-items: center; padding: 14px 16px; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; margin-bottom: 14px; }
  .hero .avatar { width: 56px; height: 56px; font-size: 20px; }
  .hero h1 { margin: 0; font-size: 20px; line-height: 1.2; }
  .hero .meta { color: var(--muted); font-size: 12px; margin-top: 3px; }
  .strip { display: flex; gap: 0; border-left: 1px solid var(--border); flex-wrap: wrap; row-gap: 8px; }
  .strip .stat { padding: 0 14px; display: flex; flex-direction: column; align-items: flex-start; border-right: 1px solid var(--border); }
  .strip .stat:last-child { border-right: 0; }
  .strip .v { font: 700 17px var(--mono); line-height: 1.1; }
  .strip .l { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-top: 2px; }
  .card.ai { border-color: var(--ai); background: var(--ai-wash); margin-bottom: 14px; }
  .card.ai.dim { opacity: .7; }
  .ai-h { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .ai-badge { font-size: 11px; font-weight: 700; color: var(--ai); border: 1px solid var(--ai); border-radius: 999px; padding: 2px 8px; }
  .ai-body p { margin: 8px 0 0; font-size: 14px; line-height: 1.55; }
  .cite { font: 600 11px var(--mono); color: var(--ai); cursor: pointer; margin-left: 2px; }
  .cite:hover { text-decoration: underline; }
  .tabs { display: flex; gap: 4px; margin: 4px 0 12px; border-bottom: 1px solid var(--border); }
  .tabs button { background: transparent; border: 0; border-bottom: 2px solid transparent; color: var(--muted); padding: 8px 12px; font: inherit; font-size: 13px; cursor: pointer; }
  .tabs button.active { color: var(--text); border-bottom-color: var(--accent); }
  .tabpane[hidden] { display: none; }
  .stmt.hl { background: rgba(201,182,255,.12); border-radius: 8px; padding: 10px 8px 4px; margin-left: -8px; margin-right: -8px; }
  @media (max-width: 1100px) { .hero { grid-template-columns: 56px 1fr; } .strip { grid-column: 1 / -1; border-left: 0; flex-wrap: wrap; } }

  /* ---- Editorial layout: masthead, hairlines instead of cards, margin notes ---- */
  .app { grid-template-columns: 236px 1fr 320px; grid-template-rows: 64px 1fr; }
  .masthead { display: grid; grid-template-columns: auto auto 1fr auto; align-items: center; gap: 28px; padding: 0 24px; background: var(--bg);
    border-bottom: 1px solid var(--border); box-shadow: inset 0 -3px 0 0 var(--bg), inset 0 -4px 0 0 var(--accent); }
  .masthead .brand { display: flex; align-items: baseline; gap: 10px; text-decoration: none; color: var(--text); }
  .masthead .logo { width: 34px; height: 34px; border-radius: 50%; align-self: center; }
  .masthead .wordmark { font-family: var(--display); font-weight: 600; font-size: 26px; letter-spacing: .02em; line-height: 1; }
  .masthead .tagline { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .masthead .modes { display: flex; gap: 22px; border: 0; margin: 0; }
  .masthead .modes button { padding: 6px 0; font-size: 13px; letter-spacing: .02em; color: var(--muted); border-bottom: 2px solid transparent; border-radius: 0; background: transparent; }
  .masthead .modes button:hover { color: var(--text); }
  .masthead .modes button.active { color: var(--text); background: transparent; border-bottom-color: var(--accent); }
  .masthead .crumb { font-size: 12px; color: var(--muted); justify-self: start; }
  .masthead .mock { margin-left: 0; border-radius: 3px; letter-spacing: .06em; text-transform: uppercase; font-size: 10px; }
  aside { background: transparent; border-right: 1px solid var(--border); padding: 18px 18px 28px; }
  .side { background: transparent; border-left: 1px solid var(--border); padding: 18px 18px 28px; }
  .side::before { content: attr(data-label); display: block; font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); margin-bottom: 10px; }
  .h { font-size: 10.5px; letter-spacing: .14em; color: var(--accent); margin: 18px 0 8px; }
  .h a { color: var(--muted); }
  .cat, .row, .btn, .search, .field select, .dir-row, .stance-line, .tag, .pill { border-radius: 3px; }
  .chip { border-radius: 3px; }
  .card { background: transparent; border: 0; border-top: 1px solid var(--border); border-radius: 0; padding: 14px 0 6px; }
  .card h3, .topic-title, .ph h1, .hero h1 { font-family: var(--display); font-weight: 600; }
  .card h3 { font-size: 17px; margin-bottom: 2px; }
  .card.ai { border: 0; border-top: 1px solid var(--ai); border-radius: 0; background: var(--ai-wash); padding: 14px 16px; margin: 14px 0; }
  .evidence { background: transparent; border: 0; border-top: 1px solid var(--border); border-radius: 0; padding: 12px 0 0; }
  .evidence blockquote { font-size: 16px; line-height: 26px; }
  .hero { background: transparent; border: 0; border-bottom: 1px solid var(--border); border-radius: 0; padding: 6px 0 18px; }
  .hero h1 { font-size: 30px; }
  .strip .v { font-size: 16px; }
  .strip .l { color: var(--muted); }
  .kpi, .stat { border-radius: 0; }
  .tabs { border-bottom: 1px solid var(--border); }
  .tabs button { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; padding: 10px 0; margin-right: 22px; }
  th { background: var(--bg); letter-spacing: .12em; }
  td.quote { font-family: var(--display); font-style: italic; }
  .legend { border-radius: 3px; background: var(--bg); }
  .topic-sub, .person-card .meta, .row .meta, .dir-row .d { letter-spacing: .01em; }
  .person-card .name { font-size: 18px; }
  #profile { padding: 18px 28px 40px; }
  .pgrid { grid-template-columns: 1fr 320px; gap: 28px; }
  @media (max-width: 1180px) { .masthead .crumb { display: none; } .masthead { gap: 18px; } .masthead .tagline { display: none; } }
  /* responsive (group 3): below 900px one pane at a time via body[data-pane] */
  .pane-switch { display: none; }
  @media (max-width: 899px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); height: 100dvh; }
    .pgrid { grid-template-columns: 1fr; }
    body[data-pane="filters"] #main, body[data-pane="filters"] .side { display: none; }
    body[data-pane="view"] aside, body[data-pane="view"] .side { display: none; }
    body[data-pane="details"] aside, body[data-pane="details"] #main { display: none; }
    aside, .side { border: 0; border-bottom: 1px solid var(--border); }
    .masthead { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 8px 12px; }
    .masthead .tagline, .masthead .crumb { display: none; }

<script>
(async () => {
  // ---------- load ----------
  // Data lives in <repo>/data. GitHub Pages copies it next to this page; local dev serves the repo root.
  const DATA_BASE = (await fetch("./data/people.json", { method: "HEAD" }).then(r => r.ok).catch(() => false)) ? "./data/" : "../../data/";
  const load = async f => { const r = await fetch(`${DATA_BASE}${f}`); if (!r.ok) throw new Error(`${f}: ${r.status}`); return r.json(); };
  let taxonomy, issuesRaw, peopleRaw, summariesRaw = { summaries: {} };
  try { [taxonomy, issuesRaw, peopleRaw] = await Promise.all(["taxonomy.json", "issues.json", "people.json"].map(load)); }
  catch (e) { document.getElementById("loading").textContent = "Could not load data/*.json — serve this folder over http (see data/README.md). " + e.message; return; }
  // Derived graph cache (fast load): graph.json is written at deploy time by
  // apps/web/build/graph.mjs from the contract-B files. When present the app
  // paints from it immediately and fetches stances.json lazily in the
  // background; when absent (local dev) stances.json loads first as before.
  let stancesRaw = null, graphRaw = null;
  for (const base of ["./data/", DATA_BASE]) { try { const r = await fetch(`${base}graph.json`); if (r.ok) { graphRaw = await r.json(); break; } } catch { /* try next base */ } }
  // Resolved once per-edge statements (quotes, bills, sources) are attached.
  // Views that read them show a "loading statements…" line meanwhile.
  let STATEMENTS_READY, _stmtsResolve, statementsReady = false, stmtsFailed = false;
  STATEMENTS_READY = new Promise(res => _stmtsResolve = res);
  const stmtsNote = () => statementsReady ? "" : stmtsFailed
    ? `<div class="empty-state">Could not load stances.json — quotes unavailable.</div>`
    : `<div class="empty-state">loading statements…</div>`;
  try { summariesRaw = await load("summaries.json"); } catch { /* optional file */ }
  const SUMMARIES = summariesRaw.summaries || {};
  // conditions ledger (optional; missing or empty = app behaves exactly as before)
  let conditionsRaw = { demands: [], conditions: [] };
  try { conditionsRaw = await load("conditions.json"); } catch { /* optional file */ }
  const DEMANDS = Object.fromEntries((conditionsRaw.demands || []).map(d => [d.id, d]));
  const CONDS = conditionsRaw.conditions || [];
  const condByPI = {}, condByPerson = {}, condByIssue = {};
  CONDS.forEach(r => { (condByPI[r.person + "|" + r.issue] ??= []).push(r); (condByPerson[r.person] ??= []).push(r); (condByIssue[r.issue] ??= []).push(r); });
  // bill id: lower-case letters+digits of the leading bill number ("H.R. 6110 …" -> "hr6110"; null for null)
  const billId = s => { if (s == null) return null; const m = /^\s*([A-Za-z.][A-Za-z.\s]*?\d+)/.exec(s); return m ? m[1].replace(/[^A-Za-z0-9]/g, "").toLowerCase() : null; };
  const nowWord = v => (v === null || v === undefined) ? "has not spoken on it" : v > .15 ? "supports now" : v < -.15 ? "opposes now" : "is neutral now";
  // lower-case a demand name for mid-sentence use after "if"/"until"; abbreviations ("Sec.") and acronyms stay untouched
  const lcFirst = s => String(s).replace(/^([A-Za-z][A-Za-z.]*)/, w => (w.includes(".") || !/^[A-Z][a-z]/.test(w)) ? w : w[0].toLowerCase() + w.slice(1));
  // stance-first what-if sentence for one condition row; nowScore = aggregated edge score for that person+issue, or null
  const phrase = (nowScore, row) => {
    const dem = lcFirst((DEMANDS[row.demand] || {}).name || row.demand), n = nowWord(nowScore);
    if (row.scope === "final_passage") return `${n}, but will <b>withhold the final-passage vote</b> until ${dem}`;
    if (row.stance_if_met === "support") return (nowScore !== null && nowScore !== undefined && nowScore < -.15)
      ? `${n} · <b style="color:var(--support)">would accept passage</b> if ${dem}`
      : `${n} · <b style="color:var(--support)">would support</b> if ${dem}`;
    return `${n} · <b style="color:var(--oppose)">would turn against it</b> if ${dem}`;
  };
  // phrase without the leading "<stance now> · " part, first letter capitalised (profile form)
  const condShort = (nowScore, row) => phrase(nowScore, row).replace(/^[^·]*· /, "").replace(/^(<b[^>]*>)?(\w)/, (m, t, c) => (t || "") + c.toUpperCase());
  const nowOf = (p, i) => edgeScoreByPI[p + "|" + i] ?? null;
  document.getElementById("loading").remove();
  function updateBadges() {
    if ([issuesRaw, peopleRaw, stancesRaw].some(x => x && x._meta && x._meta.mock)) document.getElementById("mock").hidden = false;
    { const drop = stancesRaw?._meta?.drop || issuesRaw._meta?.drop; if (drop) { const el = document.getElementById("drop"); el.textContent = `data: ${drop}`; el.hidden = false; } }
  }
  updateBadges();

  // ---------- model ----------
  // Cache adoption is validated: any shape mismatch falls back to stances.json.
  let useCache = !!graphRaw;
  if (useCache) {
    try {
      if (!Array.isArray(graphRaw.committees) || !Array.isArray(graphRaw.issues) || !Array.isArray(graphRaw.people) || !Array.isArray(graphRaw.edges)) throw new Error("bad cache shape");
      const _ip = new Set(peopleRaw.people.map(p => p.id)), _ii = new Set(issuesRaw.issues.map(i => i.id));
      if (!graphRaw.people.every(r => _ip.has(r[4])) || !graphRaw.issues.every(r => _ii.has(r[2]))) throw new Error("stale cache ids");
    } catch { useCache = false; graphRaw = null; }
  }
  // With the cache, COMMITTEES is taxonomy filtered to the cache's committee ids (taxonomy order).
  let COMMITTEES = useCache ? taxonomy.committees.filter(c => graphRaw.committees.some(g => g.id === c.id)) : taxonomy.committees;
  const PALETTE = ["#f59e0b", "#06b6d4", "#ec4899", "#84cc16", "#8b5cf6", "#f97316", "#14b8a6", "#e11d48", "#3b82f6", "#a3e635", "#d946ef", "#0ea5e9", "#facc15", "#22c55e", "#fb7185", "#2dd4bf", "#c084fc", "#f0b429", "#60a5fa", "#4ade80"];
  const CAT_HUE = Object.fromEntries(COMMITTEES.map((c, i) => [c.id, PALETTE[i % PALETTE.length]]));
  const SUBS = COMMITTEES.flatMap(c => (c.subcommittees.length ? c.subcommittees : [{ id: c.id, name: c.name, leaf: true }]).map(s => ({ ...s, cat: c.id, catName: c.name })));
  const subById = Object.fromEntries(SUBS.map(s => [s.id, s]));
  const issueRawById = Object.fromEntries(issuesRaw.issues.map(i => [i.id, i]));
  const personRawById = Object.fromEntries(peopleRaw.people.map(p => [p.id, p]));
  const ISSUES = useCache
    ? graphRaw.issues.map(([name, comIdx, id]) => { const raw = issueRawById[id], com = COMMITTEES[comIdx]; return { ...raw, name, sub: raw.parent, subName: subById[raw.parent].name, cat: com.id, catName: com.name }; })

  // bill-grouped demand panel (2.3): "What it would take" for one issue; "" when the issue has no rows
  function conditionsPanel(issueId) {
    const rows = condByIssue[issueId] || [];
    if (!rows.length) return "";
    // bills = distinct billId over stances of this issue + condition rows of this issue
    const per = new Map();
    STATEMENTS.filter(s => s.issue === issueId && s.bill && billId(s.bill)).forEach(s => { const id = billId(s.bill); if (!per.has(id)) per.set(id, { stmts: [], conds: [] }); per.get(id).stmts.push(s); });
    rows.filter(r => r.bill && billId(r.bill)).forEach(r => { const id = billId(r.bill); if (!per.has(id)) per.set(id, { stmts: [], conds: [] }); per.get(id).conds.push(r); });
    if (!per.size) return "";
    const groups = [...per.entries()].map(([id, g]) => {
      // title = text after the bill number from the latest statement, else the bill string
      const latest = g.stmts.slice().sort((a, b) => String(a.date || "").localeCompare(String(b.date || ""))).pop();
      const chosen = latest ? latest.bill : g.conds[0].bill;
      const m = /^\s*([A-Za-z.]+\s*\d+)\s*(.*)$/.exec(chosen || "");
      const num = m ? m[1].replace(/\s+/g, " ") : (chosen || id), title = m ? m[2].trim() : "";
      const onBill = rows.filter(r => billId(r.bill) === id);
      const chips = [...new Set(onBill.map(r => r.demand))].map(d => { const def = DEMANDS[d] || {}, mine = onBill.filter(r => r.demand === d);
        const wins = mine.filter(r => r.stance_if_met === "support").length, loses = mine.filter(r => r.stance_if_met === "oppose").length;
        const lines = mine.map(r => `<div><b>${byId[r.person].name}</b> ${phrase(nowOf(r.person, r.issue), r)}</div>`).join("");
        return `<button class="chip cond-chip" data-issue="${issueId}" data-demand="${d}" data-bill="${id}" data-people="${mine.map(r => r.person).join(" ")}" style="display:block;width:100%;text-align:left;margin:6px 0"><div style="font-weight:600">${def.name || d}</div><div style="font-size:11px;color:var(--muted)">${def.type || ""} · wins ${wins} · loses ${loses}</div><div style="font-size:12px;margin-top:4px">${lines}</div></button>`; }).join("");
      return `<div style="margin-top:12px;border-top:1px solid var(--border);padding-top:10px"><div style="font-weight:700">${num}${title ? ` <span style="font-weight:400;color:var(--muted)">${title}</span>` : ""}</div><a href="#/bill/${id}" style="color:var(--accent);font-size:12px">bill page ↗</a>${chips}</div>`;
    }).join("");
    return `<div class="h" style="margin-top:16px">What it would take</div>${groups}${statementsReady ? "" : stmtsNote()}`;
  }

  // bills under one issue from EDGES' bill strings (latest bill per edge) + condition rows; STATEMENTS not needed
  function issueBills(id) {
    const per = new Map();
    issEdges(id).forEach(e => {
      const bid = billId(e.bill); if (!bid) return;
      if (!per.has(bid)) per.set(bid, { id: bid, n: 0, last: "", str: "" });
      const g = per.get(bid); g.n += e.n;
      if ((e.last || "") >= (g.last || "")) { g.last = e.last; g.str = e.bill; }
    });
    (condByIssue[id] || []).forEach(r => {
      const bid = billId(r.bill); if (!bid) return;
      if (!per.has(bid)) per.set(bid, { id: bid, n: 0, last: "", str: r.bill || "" });
    });
    const conds = condByIssue[id] || [];
    return [...per.values()].map(g => {
      const m = /^\s*([A-Za-z.]+\s*\d+)\s*(.*)$/.exec(g.str || "");

  // issue halo: concentric half-rings, one per kind of action; right half = for, left half = against.
  // A dot is a member (party colour — node colour encodes party only). Arc length filled = how many. No invented spectrum.
  function I_orbit(id, es) {
    const cv2 = $("orbit"), dpr = devicePixelRatio || 1, W2 = Math.max(320, (cv2.parentElement && cv2.parentElement.clientWidth) || cv2.getBoundingClientRect().width || 320), H2 = 560;
    cv2.style.width = W2 + "px"; cv2.style.height = H2 + "px";
    cv2.width = Math.round(W2 * dpr); cv2.height = Math.round(H2 * dpr);
    const c2 = cv2.getContext("2d"); c2.setTransform(dpr, 0, 0, dpr, 0, 0);
    // draw helpers bound to THIS canvas (the Explore canvas has its own)
    const circle = (x, y, rr, fill, stroke) => { c2.beginPath(); c2.arc(x, y, rr, 0, 2 * Math.PI); if (fill && fill !== "none") { c2.fillStyle = fill; c2.fill(); } if (stroke) { c2.lineWidth = 1.5; c2.strokeStyle = stroke; c2.stroke(); } };
    const label = (t, x, y, f, c, al) => { c2.font = f; c2.fillStyle = c; c2.textAlign = al || "center"; c2.fillText(t, x, y); };
    const is = issueById[id], C = { x: W2 / 2, y: H2 - 78 };
    const L = pid => byId[pid];
    // bands: 0 sponsored (innermost) … 4 views (outer). Spoke band is split by the LLM score (left oppose / right support).
    const BANDS = [{ k: 0, label: "Sponsored", r: 0.30 }, { k: 2, label: "Voted yea · nay", r: 0.46, pair: 3 }, { k: 1, label: "Cosponsored", r: 0.62 }, { k: 5, label: "Spoke", r: 0.78 }, { k: 4, label: "Signed dissenting views", r: 0.94 }];
    const Rmax = Math.min(W2 * .46, H2 - 110);
    const hasK = es.some(e => e.kind);
    const dots = [], counts = {};
    if (hasK) BANDS.forEach(b => {
      const R = Rmax * b.r, right = [], left = [];
      es.forEach(e => {
        const k = e.kind || [], l = L(e.from);
        if (b.k === 5) { if (k[5]) ((k[6] >= ISSUE_SPLIT_T ? right : k[6] <= -ISSUE_SPLIT_T ? left : right)).push({ l, e, score: k[6], n: k[5] }); }
        else { if (k[b.k]) right.push({ l, e, n: k[b.k] }); if (b.pair != null && k[b.pair]) left.push({ l, e, n: k[b.pair] }); if (b.k === 4 && k[4]) left.push(right.pop()); }
      });
      counts[b.label] = [right.length, left.length];
      const place = (arr, side) => {
        const n = arr.length;
        arr.sort((a, c) => (a.l.party > c.l.party ? 1 : -1) || ((c.score || 0) - (a.score || 0)));
        arr.forEach((d, i) => { const t = (i + .5) / Math.max(n, 1), th = side > 0 ? (Math.PI * 1.5 + t * Math.PI * .47) : (Math.PI * 1.5 - t * Math.PI * .47), rr = R + ((i % 3) - 1) * 5.5; dots.push({ ...d, x: C.x + rr * Math.cos(th), y: C.y + rr * Math.sin(th), band: b, side }); });
      };
      place(right, 1); place(left, -1);
    });
    const bills = issueBills(id).slice(0, 5).map((b, k, arr) => ({ ...b, x: C.x - ((arr.length - 1) / 2 - k) * 120, y: C.y + 44 }));
    let hv = null;
    function paint() {
      c2.clearRect(0, 0, W2, H2);
      c2.globalAlpha = .07; c2.fillStyle = PAL.support; c2.beginPath(); c2.moveTo(C.x, C.y); c2.arc(C.x, C.y, Rmax, Math.PI * 1.5, Math.PI * 2); c2.closePath(); c2.fill();
      c2.fillStyle = PAL.oppose; c2.beginPath(); c2.moveTo(C.x, C.y); c2.arc(C.x, C.y, Rmax, Math.PI, Math.PI * 1.5); c2.closePath(); c2.fill(); c2.globalAlpha = 1;
      label("AGAINST", C.x - Rmax * .5, C.y + 22, "600 11px JetBrains Mono", PAL.oppose);
      label("FOR", C.x + Rmax * .5, C.y + 22, "600 11px JetBrains Mono", PAL.support);

  // ---------- BILL (3.1-3.3): negotiation map; everything derived from STATEMENTS/EDGES + CONDS ----------

  // projection (design decision 6): ticked oppose-if-met -> NO; ticked vote-scope support -> YES;

  function billProject(legs, active) {

    return legs.map(L => {

    if (su.length) bits.push(`${fmtList(su)} ${su.length === 1 ? "has" : "have"} no statement on file`);

      if (n.kind === "com" && n.id === E.open) continue;
      const d = (n.x - x) ** 2 + (n.y - y) ** 2, rr = (n.kind === "leg" ? 9 : 18) / E.zt.k;
      if (d < rr * rr && (!best || d < best.d)) best = { n, d };
    }
    return best && best.n;
  }
  function E_move(ev) {
    const r = cv.getBoundingClientRect();
    const x = (ev.clientX - r.left - E.zt.x) / E.zt.k, y = (ev.clientY - r.top - E.zt.y) / E.zt.k;
    const n = E_nodeAt(x, y);
    if (n !== E.hover) { E.hover = n; E_draw(); }
    if (!n) E_hideTip();
    else if (n.kind === "cond") E_tip(ev, n.rows.map(row => `<div><b>${byId[row.person].name}</b> ${phrase(n.score, row)}<div class="cond-q">“${row.quote}”</div></div>`).join(`<hr style="border:0;border-top:1px solid var(--border);margin:6px 0">`));
    else if (n.kind === "leg") E_tip(ev, E_legTip(n) + `<div style="color:var(--accent);margin-top:3px">click → profile</div>`);
    else if (n.kind === "com") E_tip(ev, `<b>${n.name}</b><br>click to open its issues`);
    else E_tip(ev, `<b>${n.name}</b><br>${(seByI.get(n.id) || []).length} legislators · click to pin`);
  }
  function E_click() {
    const hov = E.hover;
    if (!hov || hov.kind === "cond") { if (!hov) { E.pinned = null; E.hl = null; renderSide(); E_draw(); } return; }
    if (hov.kind === "leg") { openProfile(hov.id); return; }
    if (hov.kind === "com") { E.open = E.open === hov.id ? null : hov.id; E.hover = null; E.pinned = null; E_build(false); renderSide(); syncExploreHash(); return; }
    E.pinned = E.pinned && E.pinned.id === hov.id ? null : hov;
    renderSide(); E_draw();
  }
  window.E_fly = function (id) {
    if (!E) return;
    const l = E.legs.find(x => x.id === id);
    if (!l) return;
    E.pinned = l; E.hover = null; E.hl = null;
    renderSide();
    d3.select(cv).transition().duration(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 850).ease(d3.easeCubicInOut).call(E_zoom.transform, d3.zoomIdentity.translate(cv.getBoundingClientRect().width / 2, cv.getBoundingClientRect().height / 2).scale(3.2).translate(-l.x, -l.y));
    setTimeout(() => { if (state.mode === "explore") E_draw(); }, 900);
  };
  // ---------- LINKED MINIMAP (2.4) ----------
  const mmEl = () => $("mm");
  let E_mmRO = null;
  function E_mmLayout() {
    const mm = mmEl();
    if (!mm) return null;
    const dpr = devicePixelRatio || 1;
    const MW = Math.max(200, (mm.parentElement && mm.parentElement.clientWidth) || mm.getBoundingClientRect().width || 200), MH = 210;
    mm.style.width = MW + "px"; mm.style.height = MH + "px";
    mm.width = Math.round(MW * dpr); mm.height = Math.round(MH * dpr);
    const c = mm.getContext("2d");
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    const cells = [], states = [], cols = 12, rows = 8, ts = Math.min((MW - 4) / cols, (MH - 4) / rows), ox = (MW - ts * cols) / 2, oy = (MH - ts * rows) / 2;
    Object.entries(TILE).forEach(([st, [cc, rw]]) => {
      const x0 = ox + cc * ts + 1, y0 = oy + rw * ts + 1, sz = ts - 2;
      states.push({ st, x: x0, y: y0, s: sz });
      const members = PEOPLE.filter(p => p.state === st), g = Math.ceil(Math.sqrt(Math.max(1, members.length))), cs = (sz - 7) / g;
      members.forEach((l, k) => cells.push({ l, st, x: x0 + (k % g) * cs, y: y0 + 7 + Math.floor(k / g) * cs, w: Math.max(1, cs - .6), h: Math.max(1, cs - .6) }));
    });
    return { mm, c, cells, states, MW, MH };
  }
  function E_aggScore(lid, t) {
    if (E.comById.has(t)) {
      const iss = new Set(ISSUES.filter(i => i.cat === t).map(i => i.id));
      const es = (seByL.get(lid) || []).filter(e => iss.has(e.to));
      return es.length ? d3.mean(es, e => e.score) : undefined;
    }
    const es = (seByL.get(lid) || []).filter(e => e.to === t);
    return es.length ? d3.mean(es, e => e.score) : undefined;
  }
  function E_drawMM(focusT, focusL) {
    const mm = mmEl();
    if (!mm || !E || !E.mm) return;
    const { c, cells, states, MW, MH } = E.mm;
    c.clearRect(0, 0, MW, MH);
    const mode = focusT ? (E.comById.get(focusT) ? E.comById.get(focusT).name : (issueById[focusT] || {}).name) : null;
    const sc = focusT ? new Map(PEOPLE.map(p => [p.id, E_aggScore(p.id, focusT)])) : null;
    for (const s0 of states) {
      c.globalAlpha = E.stateF && E.stateF !== s0.st ? .25 : 1;
      c.fillStyle = E.stateF === s0.st ? PAL.accent : PAL.neutral;
      c.font = "600 7px JetBrains Mono"; c.textAlign = "left";
      c.fillText(s0.st, s0.x + 1, s0.y + 6);
    }
    for (const cl of cells) {
      const dim = E.stateF && cl.st !== E.stateF;
      let col = eParty(cl.l.party);
      if (sc) { const v = sc.get(cl.l.id); col = v === undefined ? "#2a3148" : eColor(dirOf(v)); }
      c.globalAlpha = dim ? .15 : 1; c.fillStyle = col;
      c.fillRect(cl.x, cl.y, cl.w, cl.h);
    }
    c.globalAlpha = 1;
    const ring = focusL || (E.mmHover && E.mmHover.l.id);
    if (ring) { const found = cells.find(cc => cc.l.id === ring); if (found) { c.strokeStyle = PAL.ink; c.lineWidth = 1.5; c.strokeRect(found.x - 1.5, found.y - 1.5, found.w + 3, found.h + 3); } }
    const modeEl = $("mmmode"), legEl = $("mmleg");
    if (modeEl) modeEl.textContent = mode ? "colour = stance on " + mode : "colour = party";
    if (legEl) legEl.innerHTML = (mode
      ? `<span><span class="sq" style="background:var(--support)"></span>supports</span><span><span class="sq" style="background:var(--oppose)"></span>opposes</span><span><span class="sq" style="background:var(--neutral)"></span>neutral</span><span><span class="sq" style="background:#2a3148"></span>no statement</span>`
      : `<span><span class="sq" style="background:var(--party-d)"></span>D</span><span><span class="sq" style="background:var(--party-r)"></span>R</span><span>hover an issue or committee in the graph to recolour</span>`)
      + (E.stateF ? ` <span class="chip" id="clrst">${STATE_NAMES[E.stateF]} only ✕</span>` : ` <span>click a state name to filter</span>`);
    const clr = $("clrst");
    if (clr) clr.onclick = () => { E.stateF = null; renderSide(); E_draw(); syncExploreHash(); };
  }
  function E_mmBind() {
    const mm = mmEl();
    if (!mm || !E) return;
    if (!E_mmRO) E_mmRO = new ResizeObserver(() => {
      if (!E || !$("mm")) return;
      const _w = ($("mm").parentElement && $("mm").parentElement.clientWidth) || 0;
      if (E.mm && Math.abs(_w - E.mm.MW) < 2) return;
      E.mm = E_mmLayout(); E_draw();
    });
    E_mmRO.disconnect();
    E.mm = E_mmLayout();
    E_drawMM(E.hover && (E.hover.kind === "com" || E.hover.kind === "issue") ? E.hover.id : E.pinned && (E.pinned.kind === "com" || E.pinned.kind === "issue") ? E.pinned.id : null, null);
    E_mmRO.observe(mm.parentElement || mm);
    mm.onmousemove = ev => {
      const r = mm.getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
      const cl = E.mm.cells.find(cc => x >= cc.x - .5 && x <= cc.x + cc.w + .5 && y >= cc.y - .5 && y <= cc.y + cc.h + .5);
      const sl = !cl && E.mm.states.find(s0 => x >= s0.x && x <= s0.x + s0.s && y >= s0.y && y <= s0.y + 7);
      mm.style.cursor = cl || sl ? "pointer" : "default";
      if ((cl || null) !== E.mmHover) {
        E.mmHover = cl || null;
        const l = cl && E.legs.find(z => z.id === cl.l.id);
        E.hover = l || null;
        E_draw();
      }
      if (cl) E_tip(ev, `<b>${cl.l.name}</b><br>${cl.l.district || cl.l.state} · ${cl.l.party}<div style="color:var(--accent);margin-top:3px">click to fly to</div>`);
      else if (sl) E_tip(ev, `<b>${STATE_NAMES[sl.st]}</b> · ${PEOPLE.filter(p => p.state === sl.st).length} seat${PEOPLE.filter(p => p.state === sl.st).length > 1 ? "s" : ""}<div style="color:var(--accent);margin-top:3px">click to show only this delegation</div>`);
      else E_hideTip();
    };
    mm.onmouseleave = () => { E.mmHover = null; E.hover = null; E_hideTip(); E_draw(); };
    mm.onclick = ev => {
      const r = mm.getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
      if (E.mmHover) { window.E_fly(E.mmHover.l.id); return; }
      const sl = E.mm.states.find(s0 => x >= s0.x && x <= s0.x + s0.s && y >= s0.y && y <= s0.y + s0.s);
      if (sl) { E.stateF = E.stateF === sl.st ? null : sl.st; E_hideTip(); renderSide(); E_draw(); syncExploreHash(); }
    };
  }
  function E_show() {
    cv.classList.add("on"); ectl.classList.add("on"); ehud.classList.add("on");
    $hint.style.display = "none";
    if (!E || E.edges !== EDGES) E_init();
    else { const _s = E_paneSize(); if (E.lastW && (Math.abs(_s.W - E.lastW) > 2 || Math.abs(_s.H - E.lastH) > 2)) E_build(false); else E_size(); }
    applyExploreQuery();
    E.query = gs.value.trim().toLowerCase();
    E.query = E.query.length >= 2 && !/^\d{5}$/.test(E.query) ? E.query : "";
    E_draw();
    E_mmBind();
    syncExploreHash();
  }
  let E_cvRO = null;
  function E_watch() {
    if (!E_cvRO) E_cvRO = new ResizeObserver(() => {
      if (state.mode !== "explore" || !E) return;
      const s = E_paneSize();
      if (Math.abs(s.W - (E.lastW || 0)) < 2 && Math.abs(s.H - (E.lastH || 0)) < 2) return;
      clearTimeout(E.rsT);
      E.rsT = setTimeout(() => { if (state.mode !== "explore" || !E) return; E_build(false); }, 120);
    });
    E_cvRO.disconnect();
    E_cvRO.observe($("main"));
  }

/* focus GRAPH view removed (group 1): Explore renders on Canvas; centre panes below. */

  // ---------- shell ----------
  function renderHeader() {
    // per-route title (group 2): exactly the delta-spec table
    { let _t = "OWL";
      if (state.mode === "profile") { const _p = byId[state.p.person]; _t = (_p ? _p.name : "Legislators") + " \u00b7 OWL"; }
      else if (state.mode === "bill") { const _bi = statementsReady ? billInfo(state.b.id) : null; _t = ((_bi && _bi.num) || "Bill") + " \u00b7 OWL"; }
      else if (state.mode === "list") _t = "Find \u00b7 OWL";
      else if (state.mode === "explore") _t = "OWL";
      else if (state.mode === "bills") _t = "Bills \u00b7 OWL";
      else if (state.mode === "issues") _t = "Issues \u00b7 OWL";
      else if (state.mode === "issue") { const _is = issueById[state.iid]; _t = ((_is && _is.name) || "Issue") + " \u00b7 OWL"; }
      else if (state.mode === "about") _t = "About \u00b7 OWL";
      document.title = _t; }
    ["explore", "issues", "bills", "list", "profile", "about"].forEach(m => $("m-" + m).classList.toggle("active", state.mode === m));
    if (state.mode === "profile") { const p = byId[state.p.person]; $crumb.innerHTML = p ? `<b>${p.name}</b> · ${seat(p)}` : `<b>Legislators</b>`; $hint.textContent = ""; }
    else if (state.mode === "bill") { const info = statementsReady ? billInfo(state.b.id) : null; $crumb.innerHTML = info ? `<b>${info.num}</b> · ${billTitleDisp(info) || "Bill"}` : `<b>Bill</b> · ${statementsReady ? "not found" : "loading statements…"}`; $hint.textContent = ""; }
    else if (state.mode === "list") { $crumb.innerHTML = `<b>Legislator list</b> · dropdown filters`; $hint.textContent = ""; }
    else if (state.mode === "explore") { $crumb.innerHTML = `<b>All issues</b> · filtered view`; $hint.textContent = "Click a committee to open it in place · hover or pin to see all of a node's edges · scroll to zoom · / to search · click empty space to reset"; }
    else if (state.mode === "bills") { $crumb.innerHTML = `<b>Bills</b> · every bill in data`; $hint.textContent = "Filter by number or title · most statements first · click a row for the negotiation map"; }
    else if (state.mode === "issues") { $crumb.innerHTML = `<b>Issues</b> · directory`; $hint.textContent = "Bar = support / neutral / oppose among legislators on record · click an issue for its halo page"; }
    else if (state.mode === "about") { $crumb.innerHTML = "<b>About</b> | methodology"; $hint.textContent = ""; }
    else { const i = issueById[state.iid]; $crumb.innerHTML = i ? `<b>${i.catName}</b> › ${i.subName} › <b>${i.name}</b>` : "Pick an issue"; $hint.textContent = ""; }
  }
  function renderAside() { ({ explore: renderExploreAside, issues: renderIssuesAside, issue: renderIssueAside, bills: renderBillsAside, list: renderListAside, profile: renderProfileAside, bill: renderBillAside, about: renderAboutAside })[state.mode](); }
  function renderSide() {
    const hasEvidence = state.mode === "explore" ? !!state.person : state.mode === "list" ? !!state.l.sel : state.mode === "issue" ? true : !!state.p.sel;
    $side.dataset.label = hasEvidence ? "Evidence" : state.mode === "explore" ? "In view" : "Notes";
    ({ explore: renderExploreSide, issues: renderIssuesSide, issue: renderIssueSide, bills: renderBillsSide, list: renderListSide, profile: renderProfileSide, bill: renderBillSide, about: renderAboutSide })[state.mode]();
    $side.querySelectorAll("[data-open]").forEach(b => b.onclick = () => openProfile(b.dataset.open));
    $side.querySelectorAll("[data-about]").forEach(b => b.onclick = () => { location.hash = "#/about"; });
    $side.querySelectorAll("[data-copy]").forEach(b => b.onclick = () => copyLink(b));
    bindCondChips();
  }
  function render() { document.body.dataset.pane = state.pane || "view"; renderHeader(); renderAside(); renderSide(); renderCenter(); const _sw = document.getElementById("pane-switch"); if (_sw) _sw.querySelectorAll("button").forEach(b => b.classList.toggle("active", b.dataset.pane === (state.pane || "view"))); }
  $("m-explore").onclick = () => { if (location.hash === "#/explore") { routeFromHash(); render(); } else location.hash = "#/explore"; };
  $("m-list").onclick = () => { if (location.hash === "#/find") { routeFromHash(); render(); } else location.hash = "#/find"; };
  $("m-profile").onclick = () => { if (location.hash === "#/legislators") { routeFromHash(); render(); } else location.hash = "#/legislators"; };
  $("m-about").onclick = () => { if (location.hash === "#/about") { routeFromHash(); render(); } else location.hash = "#/about"; };
$("m-issues").onclick = goIssues;
$("m-bills").onclick = goBills;
  $("pane-switch").querySelectorAll("button").forEach(b => b.onclick = () => { state.pane = b.dataset.pane; render(); });
  $("brand").onclick = e => { e.preventDefault(); state.person = null; if (!location.hash || location.hash === "#/explore") { routeFromHash(); render(); } else location.hash = "#/explore"; };
  window.addEventListener("hashchange", () => { routeFromHash(); render(); });
  render();
  E_watch();
  window.addEventListener("resize", () => { if (state.mode === "list") renderCenter(); });
})();
