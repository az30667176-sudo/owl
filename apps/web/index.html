<head>

<title>OWL — Open Watch on Legislators</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
  /* OWL Night Watch tokens: see the design system (claude.ai/artifact/EpJB5dSQaBEEuKzhToDhF1) */
  :root {
    --bg: #0f1322; --panel: #171c2e; --panel-2: #1f2538; --border: #2c3348; --border-strong: #4a5372;
    --text: #efe6d2; --muted: #aaa493; --faint: #6c6f7d;
    --accent: #f0b429; --on-accent: #1a1200; --parchment: #efe6d2;
    --support: #3fcf77; --oppose: #f2705f; --neutral: #9aa3b2;
    --party-d: #5b8cff; --party-r: #ff7a6b; --party-i: #b9bfcc;
    --ai: #c9b6ff; --ai-wash: #1d1a33;
    --sans: "Public Sans", "Segoe UI", system-ui, sans-serif;
    --display: "Fraunces", "Iowan Old Style", Georgia, serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 var(--sans); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  h1, .topic-title, .person-card .name, .ph h1, .hero h1 { font-family: var(--display); font-weight: 600; letter-spacing: -.01em; }
  .app { display: grid; grid-template-columns: 280px 1fr 360px; grid-template-rows: 48px 1fr; height: 100vh; }
  header { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; padding: 0 16px; border-bottom: 1px solid var(--border); background: var(--panel); }
  header .brand { font-weight: 700; letter-spacing: .3px; }
  header .crumb { color: var(--muted); font-size: 13px; }
  header .crumb b { color: var(--text); font-weight: 600; }
  .modes { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-left: 8px; }
  .modes button { background: transparent; border: 0; color: var(--muted); padding: 5px 12px; cursor: pointer; font: inherit; font-size: 12px; }
  .modes button.active { background: var(--accent); color: var(--on-accent); }
  header .mock { margin-left: auto; font-size: 11px; padding: 3px 8px; border: 1px solid var(--accent); color: var(--accent); border-radius: 999px; }
  aside, section, .side { overflow: auto; }
  aside { border-right: 1px solid var(--border); background: var(--panel); padding: 10px 12px 24px; }
  .h { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 14px 4px 6px; display: flex; justify-content: space-between; }
  .h a { color: var(--accent); cursor: pointer; text-transform: none; letter-spacing: 0; font-size: 11px; }
  .cat { padding: 7px 10px; border-radius: 8px; cursor: pointer; color: var(--text); display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
  .cat:hover { background: var(--panel-2); }
  .cat.active { background: rgba(240,180,41,.14); color: var(--accent); }
  .cat .n { color: var(--muted); font-size: 12px; }
  .subs { display: flex; flex-wrap: wrap; gap: 6px; padding: 2px 4px 4px; }
  .chip { font-size: 12px; padding: 4px 10px; border: 1px solid var(--border); border-radius: 999px; cursor: pointer; color: var(--muted); user-select: none; }
  .chip:hover { border-color: var(--accent); color: var(--text); }
  .chip.active { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .chip.empty { opacity: .4; cursor: default; }
  .chip.d.active { background: var(--party-d); border-color: var(--party-d); color: #06112b; }
  .chip.r.active { background: var(--party-r); border-color: var(--party-r); color: #2b0906; }
  .chip.support.active { background: var(--support); border-color: var(--support); color: #04200f; }
  .chip.oppose.active { background: var(--oppose); border-color: var(--oppose); color: #2b0906; }
  .chip.neutral.active { background: var(--neutral); border-color: var(--neutral); color: #111; }
  .search, .field select { width: 100%; background: var(--panel-2); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 7px 10px; font: inherit; font-size: 13px; outline: none; }
  .search:focus, .field select:focus { border-color: var(--accent); }
  .field { margin: 0 4px 10px; }
  .field label { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px; }
  .group { margin: 4px 4px 0; }
  .group .gh { display: flex; align-items: center; gap: 8px; padding: 6px 6px; border-radius: 8px; cursor: pointer; }
  .group .gh:hover { background: var(--panel-2); }
  .group .gh .sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .group .gh .name { flex: 1; font-weight: 600; font-size: 13px; }
  .group .gh .n { color: var(--muted); font-size: 11px; }
  .group .gh input { accent-color: var(--accent); }
  .group .subl { font-size: 11px; color: var(--muted); padding: 4px 0 2px 24px; }
  .group .subs { padding-left: 24px; }
  .stat { font-size: 12px; color: var(--muted); margin: 10px 4px 0; }
  section { position: relative; }
  svg { width: 100%; height: 100%; display: block; }
  .legend { position: absolute; left: 14px; bottom: 12px; display: flex; gap: 14px; font-size: 12px; color: var(--muted); background: rgba(23,26,33,.85); padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
  .hint { position: absolute; left: 14px; top: 12px; font-size: 12px; color: var(--muted); }
  .side { border-left: 1px solid var(--border); background: var(--panel); padding: 14px; }
  .topic-title { font-size: 18px; font-weight: 700; margin: 0 0 2px; }
  .topic-sub { color: var(--muted); font-size: 12px; margin-bottom: 12px; }
  .spectrum { height: 8px; border-radius: 999px; background: linear-gradient(90deg, var(--oppose), var(--border-strong) 50%, var(--support)); position: relative; margin: 6px 0 14px; }
  .spectrum .tick { position: absolute; top: -4px; width: 4px; height: 16px; border-radius: 2px; background: white; opacity: .85; transform: translateX(-2px); }
  .row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 8px 8px; border-radius: 8px; cursor: pointer; }
  .row:hover, .row.active { background: var(--panel-2); }
  .row .name { font-weight: 600; }
  .row .meta { color: var(--muted); font-size: 12px; }
  .bar { height: 6px; border-radius: 999px; background: var(--border); position: relative; margin-top: 5px; overflow: hidden; }
  .bar > span { position: absolute; top: 0; bottom: 0; }
  .score { font-family: var(--mono); font-size: 12px; min-width: 44px; text-align: right; }
  .evidence { margin-top: 14px; padding: 12px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px; }
  .evidence blockquote { margin: 8px 0; padding-left: 10px; border-left: 3px solid var(--accent); color: var(--text); font-family: var(--display); font-style: italic; font-size: 15px; line-height: 24px; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .tag { font-size: 11px; padding: 2px 7px; border-radius: 6px; border: 1px solid var(--border); color: var(--muted); font-family: var(--mono); }
  .tag.c-high, .tag.c-super_high { border-color: var(--support); color: var(--support); }
  .tag.c-mid { border-color: var(--accent); color: var(--accent); }
  .tag.c-low { border-color: var(--oppose); color: var(--oppose); }
  .evidence a { color: var(--accent); font-size: 12px; }
  .empty-state { color: var(--muted); padding: 20px 8px; }
  .node-label { font-size: 11px; fill: var(--text); pointer-events: none; }
  .node-label.topic { font-size: 12px; font-weight: 700; fill: var(--text); }
  .person-card { padding: 10px 8px; border-radius: 8px; }
  .person-card .name { font-weight: 700; font-size: 16px; }
  .person-card .meta { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
  .stance-line { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 6px 8px; border-radius: 8px; cursor: pointer; }
  .stance-line:hover, .stance-line.active { background: var(--panel-2); }
  .stance-line .t { font-size: 13px; }
  .stance-line .c { font-size: 11px; color: var(--muted); }
  .btn { background: var(--panel-2); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 5px 10px; font: inherit; font-size: 12px; cursor: pointer; }
  .btn:hover { border-color: var(--accent); }
  #table-wrap { position: absolute; inset: 0; overflow: auto; padding: 14px; display: none; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { position: sticky; top: 0; background: var(--panel); color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; cursor: pointer; user-select: none; }
  th.sorted { color: var(--text); }
  tbody tr { cursor: pointer; }
  tbody tr:hover, tbody tr.active { background: var(--panel-2); }
  td.quote { max-width: 320px; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .pill.D { background: rgba(91,140,255,.2); color: var(--party-d); } .pill.R { background: rgba(255,122,107,.2); color: var(--party-r); } .pill.I { background: rgba(185,191,204,.2); color: var(--party-i); }
  .pill.support { background: rgba(63,207,119,.18); color: var(--support); } .pill.oppose { background: rgba(242,112,95,.18); color: var(--oppose); } .pill.neutral { background: rgba(154,163,178,.18); color: var(--neutral); }
  .pill.house { background: rgba(240,180,41,.18); color: var(--accent); } .pill.senate { background: rgba(245,158,11,.18); color: var(--accent); }
  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; color: var(--muted); font-size: 12px; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); color: var(--muted); z-index: 10; }
  /* profile mode */
  #profile { position: absolute; inset: 0; overflow: auto; padding: 18px 22px 30px; display: none; }
  .ph { display: flex; gap: 18px; align-items: flex-start; margin-bottom: 18px; }
  .ph .avatar { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 22px; color: white; flex: none; }
  .ph h1 { margin: 0; font-size: 22px; }
  .ph .meta { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .ph .kpis { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
  .kpi { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; min-width: 92px; }
  .kpi .v { font-size: 18px; font-weight: 700; font-family: var(--mono); }
  .kpi .l { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .pgrid { display: grid; grid-template-columns: 1fr 300px; gap: 18px; align-items: start; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px; }
  .card h3 { margin: 0 0 4px; font-size: 14px; }
  .card .sub { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
  .pbar-row { cursor: pointer; }
  .pbar-row:hover rect.bg, .pbar-row.active rect.bg { fill: var(--panel-2); }
  .dir-list { display: flex; flex-direction: column; gap: 4px; margin-top: 4px; }
  .dir-row { display: flex; justify-content: space-between; align-items: center; padding: 7px 8px; border-radius: 8px; cursor: pointer; }
  .dir-row:hover, .dir-row.active { background: var(--panel-2); }
  .dir-row .n { font-weight: 600; font-size: 13px; }
  .dir-row .d { color: var(--muted); font-size: 11px; }
  .link { color: var(--accent); cursor: pointer; font-size: 12px; }
  @media (max-width: 1100px) { .pgrid { grid-template-columns: 1fr; } }
  /* profile v2 */
  .hero { display: grid; grid-template-columns: 56px minmax(260px, 1fr) auto; gap: 16px; align-items: center; padding: 14px 16px; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; margin-bottom: 14px; }
  .hero .avatar { width: 56px; height: 56px; font-size: 20px; }
  .hero h1 { margin: 0; font-size: 20px; line-height: 1.2; }
  .hero .meta { color: var(--muted); font-size: 12px; margin-top: 3px; }
  .strip { display: flex; gap: 0; border-left: 1px solid var(--border); flex-wrap: wrap; row-gap: 8px; }
  .strip .stat { padding: 0 14px; display: flex; flex-direction: column; align-items: flex-start; border-right: 1px solid var(--border); }
  .strip .stat:last-child { border-right: 0; }
  .strip .v { font: 700 17px var(--mono); line-height: 1.1; }
  .strip .l { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-top: 2px; }
  .card.ai { border-color: var(--ai); background: var(--ai-wash); margin-bottom: 14px; }
  .card.ai.dim { opacity: .7; }
  .ai-h { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .ai-badge { font-size: 11px; font-weight: 700; color: var(--ai); border: 1px solid var(--ai); border-radius: 999px; padding: 2px 8px; }
  .ai-body p { margin: 8px 0 0; font-size: 14px; line-height: 1.55; }
  .cite { font: 600 11px var(--mono); color: var(--ai); cursor: pointer; margin-left: 2px; }
  .cite:hover { text-decoration: underline; }
  .tabs { display: flex; gap: 4px; margin: 4px 0 12px; border-bottom: 1px solid var(--border); }
  .tabs button { background: transparent; border: 0; border-bottom: 2px solid transparent; color: var(--muted); padding: 8px 12px; font: inherit; font-size: 13px; cursor: pointer; }
  .tabs button.active { color: var(--text); border-bottom-color: var(--accent); }
  .tabpane[hidden] { display: none; }
  .stmt.hl { background: rgba(201,182,255,.12); border-radius: 8px; padding: 10px 8px 4px; margin-left: -8px; margin-right: -8px; }
  @media (max-width: 1100px) { .hero { grid-template-columns: 56px 1fr; } .strip { grid-column: 1 / -1; border-left: 0; flex-wrap: wrap; } }

  /* ---- Editorial layout: masthead, hairlines instead of cards, margin notes ---- */
  .app { grid-template-columns: 236px 1fr 320px; grid-template-rows: 64px 1fr; }
  .masthead { display: grid; grid-template-columns: auto auto 1fr auto; align-items: center; gap: 28px; padding: 0 24px; background: var(--bg);
    border-bottom: 1px solid var(--border); box-shadow: inset 0 -3px 0 0 var(--bg), inset 0 -4px 0 0 var(--accent); }
  .masthead .brand { display: flex; align-items: baseline; gap: 10px; text-decoration: none; color: var(--text); }
  .masthead .logo { width: 34px; height: 34px; border-radius: 50%; align-self: center; }
  .masthead .wordmark { font-family: var(--display); font-weight: 600; font-size: 26px; letter-spacing: .02em; line-height: 1; }
  .masthead .tagline { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .masthead .modes { display: flex; gap: 22px; border: 0; margin: 0; }
  .masthead .modes button { padding: 6px 0; font-size: 13px; letter-spacing: .02em; color: var(--muted); border-bottom: 2px solid transparent; border-radius: 0; background: transparent; }
  .masthead .modes button:hover { color: var(--text); }
  .masthead .modes button.active { color: var(--text); background: transparent; border-bottom-color: var(--accent); }
  .masthead .crumb { font-size: 12px; color: var(--muted); justify-self: start; }
  .masthead .mock { margin-left: 0; border-radius: 3px; letter-spacing: .06em; text-transform: uppercase; font-size: 10px; }
  aside { background: transparent; border-right: 1px solid var(--border); padding: 18px 18px 28px; }
  .side { background: transparent; border-left: 1px solid var(--border); padding: 18px 18px 28px; }
  .side::before { content: attr(data-label); display: block; font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); margin-bottom: 10px; }
  .h { font-size: 10.5px; letter-spacing: .14em; color: var(--accent); margin: 18px 0 8px; }
  .h a { color: var(--muted); }
  .cat, .row, .btn, .search, .field select, .dir-row, .stance-line, .tag, .pill { border-radius: 3px; }
  .chip { border-radius: 3px; }
  .card { background: transparent; border: 0; border-top: 1px solid var(--border); border-radius: 0; padding: 14px 0 6px; }
  .card h3, .topic-title, .ph h1, .hero h1 { font-family: var(--display); font-weight: 600; }
  .card h3 { font-size: 17px; margin-bottom: 2px; }
  .card.ai { border: 0; border-top: 1px solid var(--ai); border-radius: 0; background: var(--ai-wash); padding: 14px 16px; margin: 14px 0; }
  .evidence { background: transparent; border: 0; border-top: 1px solid var(--border); border-radius: 0; padding: 12px 0 0; }
  .evidence blockquote { font-size: 16px; line-height: 26px; }
  .hero { background: transparent; border: 0; border-bottom: 1px solid var(--border); border-radius: 0; padding: 6px 0 18px; }
  .hero h1 { font-size: 30px; }
  .strip .v { font-size: 16px; }
  .strip .l { color: var(--muted); }
  .kpi, .stat { border-radius: 0; }
  .tabs { border-bottom: 1px solid var(--border); }
  .tabs button { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; padding: 10px 0; margin-right: 22px; }
  th { background: var(--bg); letter-spacing: .12em; }
  td.quote { font-family: var(--display); font-style: italic; }
  .legend { border-radius: 3px; background: var(--bg); }
  .topic-sub, .person-card .meta, .row .meta, .dir-row .d { letter-spacing: .01em; }
  .person-card .name { font-size: 18px; }
  #profile { padding: 18px 28px 40px; }
  .pgrid { grid-template-columns: 1fr 320px; gap: 28px; }
  @media (max-width: 1180px) { .masthead .crumb { display: none; } .masthead { gap: 18px; } .masthead .tagline { display: none; } }

  /* bill page (3.2-3.3): structure mirrors data/_site/bill-page.html, tokens only */
  #bill { position: absolute; inset: 0; overflow: auto; padding: 18px 22px 30px; display: none; }
  .bill-wrap { max-width: 1180px; }
  .bill-wrap .crumbline { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-family: var(--mono); }
  .bill-wrap .crumbline a { color: var(--accent); cursor: pointer; text-decoration: none; }

  .bill-sec { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); margin: 18px 0 8px; font-family: var(--mono); }
  .bill-spec { position: relative; height: 64px; margin: 14px 0 4px; }
  .bill-spec .lead { position: absolute; width: 1px; background: var(--border-strong); transform: translateX(-50%); }
  .bill-spec .ax { position: absolute; top: 24px; left: 0; right: 0; border-top: 1px solid var(--border-strong); }

  .bill-spec .nm { position: absolute; top: 38px; font: 500 10px var(--mono); color: var(--muted); transform: translateX(-50%); white-space: nowrap; }

  .bill-warn { display: none; border-left: 2px solid var(--oppose); background: rgba(242,112,95,.1); padding: 6px 10px; font-size: 12px; margin-top: 8px; }
  .bill-tally { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin: 12px 0 4px; }

  .bill-tally b { font: 700 24px/1 var(--mono); display: block; }

  .bill-tally span { font-size: 11px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
  .bill-moves { margin: 6px 0 0; padding: 0; list-style: none; font-size: 13px; }
  .bill-moves li { padding: 6px 0; border-bottom: 1px solid var(--border); }

  .bill-read .k { font: 500 10px var(--mono); letter-spacing: .1em; color: var(--ai); text-transform: uppercase; display: block; margin-bottom: 3px; }
  .bill-card { margin-top: 14px; border-top: 1px solid var(--border); padding-top: 12px; min-height: 84px; }
  .bill-card h3 { font-size: 17px; margin: 0 0 2px; }
  .bill-card .meta { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
  .bill-card .c { display: grid; grid-template-columns: 12px 1fr; gap: 8px; padding: 6px 0; border-top: 1px dashed var(--border); font-size: 13px; }
  .bill-card .c .cdot { width: 9px; height: 9px; border-radius: 50%; margin-top: 6px; }
  .bill-card .c .q { font-family: var(--display); font-style: italic; color: var(--muted); }
  #bill .dim { opacity: .18 !important; }
  /* conditions markers (2.2): fixed-position what-if tooltip in existing tokens */
  .cond-tip { background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 12px; }
  .cond-tip .cond-q { font-family: var(--display); font-style: italic; color: var(--muted); margin-top: 4px; font-size: 14px; line-height: 22px; }
</style>
</head>
<body>
<div id="loading">Loading data…</div>
<div class="app">
  <header class="masthead">
    <a class="brand" href="#" id="brand"><img class="logo" src="assets/logo/owl-mark-64.png" alt=""><span class="wordmark">OWL</span><span class="tagline">Open Watch on Legislators</span></a>
    <nav class="modes" aria-label="Sections"><button id="m-explore">Explore</button><button id="m-focus">Issues</button><button id="m-list">Find</button><button id="m-profile">Legislators</button></nav>
    <span class="crumb" id="crumb"></span>
    <span class="mock" id="mock" hidden>Mock data · fictional legislators</span>
  </header>
  <aside id="aside"></aside>
  <section>
    <div class="hint" id="hint"></div>
    <svg id="graph"></svg>
    <div id="table-wrap"></div>
    <div id="profile"></div>
    <div id="bill"></div>
    <div class="legend" id="legend">
      <span><i style="background:var(--support)"></i>Support</span>
      <span><i style="background:var(--oppose)"></i>Oppose</span>
      <span><i style="background:var(--neutral)"></i>Neutral</span>
      <span style="margin-left:6px">width = attention · opacity = strength · dashed = flipped</span>
    </div>
  </section>
  <div class="side" id="side"></div>
</div>

<script>
(async () => {
  // ---------- load ----------
  // Data lives in <repo>/data. GitHub Pages copies it next to this page; local dev serves the repo root.
  const DATA_BASE = (await fetch("./data/people.json", { method: "HEAD" }).then(r => r.ok).catch(() => false)) ? "./data/" : "../../data/";
  const load = async f => { const r = await fetch(`${DATA_BASE}${f}`); if (!r.ok) throw new Error(`${f}: ${r.status}`); return r.json(); };
  let taxonomy, issuesRaw, peopleRaw, stancesRaw, summariesRaw = { summaries: {} };
  try { [taxonomy, issuesRaw, peopleRaw, stancesRaw] = await Promise.all(["taxonomy.json", "issues.json", "people.json", "stances.json"].map(load)); }
  catch (e) { document.getElementById("loading").textContent = "Could not load data/*.json — serve this folder over http (see data/README.md). " + e.message; return; }
  try { summariesRaw = await load("summaries.json"); } catch { /* optional file */ }
  const SUMMARIES = summariesRaw.summaries || {};
  // conditions ledger (optional; missing or empty = app behaves exactly as before)
  let conditionsRaw = { demands: [], conditions: [] };
  try { conditionsRaw = await load("conditions.json"); } catch { /* optional file */ }
  const DEMANDS = Object.fromEntries((conditionsRaw.demands || []).map(d => [d.id, d]));
  const CONDS = conditionsRaw.conditions || [];
  const condByPI = {}, condByPerson = {}, condByIssue = {};
  CONDS.forEach(r => { (condByPI[r.person + "|" + r.issue] ??= []).push(r); (condByPerson[r.person] ??= []).push(r); (condByIssue[r.issue] ??= []).push(r); });
  // bill id: lower-case letters+digits of the leading bill number ("H.R. 6110 …" -> "hr6110"; null for null)
  const billId = s => { if (s == null) return null; const m = /^\s*([A-Za-z.][A-Za-z.\s]*?\d+)/.exec(s); return m ? m[1].replace(/[^A-Za-z0-9]/g, "").toLowerCase() : null; };
  const nowWord = v => (v === null || v === undefined) ? "has not spoken on it" : v > .15 ? "supports now" : v < -.15 ? "opposes now" : "is neutral now";
  // lower-case a demand name for mid-sentence use after "if"/"until"; abbreviations ("Sec.") and acronyms stay untouched
  const lcFirst = s => String(s).replace(/^([A-Za-z][A-Za-z.]*)/, w => (w.includes(".") || !/^[A-Z][a-z]/.test(w)) ? w : w[0].toLowerCase() + w.slice(1));
  // stance-first what-if sentence for one condition row; nowScore = aggregated edge score for that person+issue, or null
  const phrase = (nowScore, row) => {
    const dem = lcFirst((DEMANDS[row.demand] || {}).name || row.demand), n = nowWord(nowScore);
    if (row.scope === "final_passage") return `${n}, but will <b>withhold the final-passage vote</b> until ${dem}`;
    if (row.stance_if_met === "support") return (nowScore !== null && nowScore !== undefined && nowScore < -.15)
      ? `${n} · <b style="color:var(--support)">would accept passage</b> if ${dem}`
      : `${n} · <b style="color:var(--support)">would support</b> if ${dem}`;
    return `${n} · <b style="color:var(--oppose)">would turn against it</b> if ${dem}`;
  };
  // phrase without the leading "<stance now> · " part, first letter capitalised (profile form)
  const condShort = (nowScore, row) => phrase(nowScore, row).replace(/^[^·]*· /, "").replace(/^(<b[^>]*>)?(\w)/, (m, t, c) => (t || "") + c.toUpperCase());
  const nowOf = (p, i) => edgeScoreByPI[p + "|" + i] ?? null;
  document.getElementById("loading").remove();
  if ([issuesRaw, peopleRaw, stancesRaw].some(x => x._meta && x._meta.mock)) document.getElementById("mock").hidden = false;

  // ---------- model ----------
  const COMMITTEES = taxonomy.committees;
  const PALETTE = ["#f59e0b", "#06b6d4", "#ec4899", "#84cc16", "#8b5cf6", "#f97316", "#14b8a6", "#e11d48", "#3b82f6", "#a3e635", "#d946ef", "#0ea5e9", "#facc15", "#22c55e", "#fb7185", "#2dd4bf", "#c084fc", "var(--accent)", "#60a5fa", "#4ade80"];
  const CAT_HUE = Object.fromEntries(COMMITTEES.map((c, i) => [c.id, PALETTE[i % PALETTE.length]]));
  const SUBS = COMMITTEES.flatMap(c => (c.subcommittees.length ? c.subcommittees : [{ id: c.id, name: c.name, leaf: true }]).map(s => ({ ...s, cat: c.id, catName: c.name })));
  const subById = Object.fromEntries(SUBS.map(s => [s.id, s]));
  const ISSUES = issuesRaw.issues.filter(i => subById[i.parent] || console.warn("issue with unknown parent dropped:", i)).map(i => ({ ...i, sub: i.parent, subName: subById[i.parent].name, cat: subById[i.parent].cat, catName: subById[i.parent].catName }));
  const issueById = Object.fromEntries(ISSUES.map(i => [i.id, i]));
  const PEOPLE = peopleRaw.people; const byId = Object.fromEntries(PEOPLE.map(p => [p.id, p]));
  // One row per statement in the data; aggregate to one edge per (person, issue).
  const CONF = ["low", "mid", "high", "super_high"], CONF_W = { low: .4, mid: .7, high: 1, super_high: 1.2 };
  const dirOf = s => s > 0.15 ? "support" : s < -0.15 ? "oppose" : "neutral";
  const STATEMENTS = stancesRaw.stances.filter(s => (byId[s.person] && issueById[s.issue]) || console.warn("statement with unknown person/issue dropped:", s));
  const stById = Object.fromEntries(STATEMENTS.filter(s => s.statement_id).map(s => [s.statement_id, s]));
  // Salience ("heat"): how much a legislator talks about an issue, not which side.
  // sum over statements of 2^(-age_days/180). All sources are official records, so no venue weighting. Mock data uses the newest statement date as "today" so the demo is stable.
  const NOW = stancesRaw._meta?.mock ? d3.max(STATEMENTS, s => new Date(s.date || 0)) : new Date();
  const heatOf = s => { const days = s.date ? (NOW - new Date(s.date)) / 864e5 : 365; return Math.pow(2, -Math.max(0, days) / 180); };
  const EDGES = [...d3.group(STATEMENTS, s => s.person + "|" + s.issue).values()].map(list => {
    const st = [...list].sort((a, b) => String(a.date || "").localeCompare(String(b.date || "")));
    const w = st.map(s => CONF_W[s.llm_confidence] || .7), score = st.reduce((a, s, i) => a + s.score * w[i], 0) / w.reduce((a, b) => a + b, 0);
    const latest = st[st.length - 1], dirs = st.map(s => s.direction);
    return { from: latest.person, to: latest.issue, score, direction: dirOf(score), n: st.length, statements: st, salience: st.reduce((a, s) => a + heatOf(s), 0),
      linkage: CONF[Math.max(...st.map(s => CONF.indexOf(s.linkage)))], llm_confidence: CONF[Math.max(...st.map(s => CONF.indexOf(s.llm_confidence)))],
      flip: new Set(dirs.filter(d => d !== "neutral")).size > 1, first: st[0].date, last: latest.date,
      quote: latest.quote, bill: latest.bill, source: latest.source, model: latest.model };
  });
  { const sorted = EDGES.map(e => e.salience).sort((a, b) => a - b); EDGES.forEach(e => e.heat = sorted.length > 1 ? sorted.indexOf(e.salience) / (sorted.length - 1) : 1); } // global percentile 0..1
  const heatW = h => 1 + h * 5; // edge width from heat percentile
  const edgeScoreByPI = Object.fromEntries(EDGES.map(e => [e.from + "|" + e.to, e.score]));
  const STATES = [...new Set(PEOPLE.map(p => p.state))].sort();
  const color = d => d === "support" ? "var(--support)" : d === "oppose" ? "var(--oppose)" : "var(--neutral)";
  const lw = { low: 1, mid: 2, high: 3.5, super_high: 5 };
  const countFor = issue => EDGES.filter(e => e.to === issue).length;
  const seat = p => p.chamber === "senate" ? `Senate · ${p.state}` : p.district;
  const title = p => p.name;

  const state = {
    mode: "explore", cat: null, sub: null, issue: null, person: null, edge: null,
    f: { issues: new Set(ISSUES.filter(i => countFor(i.id) > 0).map(i => i.id)), chambers: new Set(["house", "senate"]), state: "", parties: new Set(["D", "R", "I"]), dirs: new Set(["support", "oppose", "neutral"]), minConf: 0, q: "" },
    l: { chamber: "", state: "", cat: "", sub: "", issue: "", dir: "", party: "", gender: "", minConf: 0, sort: "score", desc: true, sel: null },
    p: { person: null, sel: null, q: "" },
    b: { id: null, ticked: [], sel: null }
  };
  // deep link: #/legislator/<id> + #/bill/<id> (3.1)
  const openBill = id => { state.mode = "bill"; state.b.id = id; state.b.ticked = []; state.b.sel = null; history.replaceState(null, "", `#/bill/${id}`); render(); };
  { const m = /^#\/legislator\/([\w-]+)/.exec(location.hash); if (m && byId[m[1]]) { state.mode = "profile"; state.p.person = m[1]; } }
  { const m = /^#\/bill\/([\w-]+)/.exec(location.hash); if (m) { state.mode = "bill"; state.b.id = m[1]; } }
  // default focus = first issue with stances
  { const first = ISSUES.find(i => countFor(i.id) > 0); if (first) { state.cat = first.cat; state.sub = first.sub; state.issue = first.id; } }

  const $ = id => document.getElementById(id);
  const $aside = $("aside"), $side = $("side"), $crumb = $("crumb"), $hint = $("hint");
  // what-if tooltip for condition markers (no app tooltip exists; styled like the reference, existing tokens only)
  const condTip = document.createElement("div");
  condTip.className = "cond-tip";
  condTip.style.cssText = "position:fixed;pointer-events:none;display:none;z-index:9;max-width:320px;";
  document.body.appendChild(condTip);
  let graphLinkSel = null; // current graph edge selection, for demand-chip highlight (2.3)
  const toggle = (set, v) => set.has(v) ? set.delete(v) : set.add(v);
  const personOk = (p, f) => f.chambers.has(p.chamber) && (!f.state || p.state === f.state) && f.parties.has(p.party);

  // ---------- EXPLORE ----------
  function filteredEdges() {
    const f = state.f, q = f.q.trim().toLowerCase();
    return EDGES.filter(e => f.issues.has(e.to) && personOk(byId[e.from], f) && f.dirs.has(e.direction) && CONF.indexOf(e.llm_confidence) >= f.minConf
      && (!q || byId[e.from].name.toLowerCase().includes(q) || issueById[e.to].name.toLowerCase().includes(q)));
  }
  function renderExploreAside() {
    const f = state.f;
    const chip = (cls, id, label, on) => `<span class="chip ${cls} ${on ? "active" : ""}" data-k="${cls}" data-id="${id}">${label}</span>`;
    const groups = COMMITTEES.map(c => {
      const issues = ISSUES.filter(i => i.cat === c.id && countFor(i.id) > 0);
      if (!issues.length) return "";
      const allOn = issues.every(i => f.issues.has(i.id)), anyOn = issues.some(i => f.issues.has(i.id));
      const bySub = {}; issues.forEach(i => (bySub[i.sub] ??= []).push(i));
      return `<div class="group">
        <label class="gh"><input type="checkbox" data-cat="${c.id}" ${allOn ? "checked" : ""} ${!allOn && anyOn ? "data-ind=1" : ""}><span class="sw" style="background:${CAT_HUE[c.id]}"></span><span class="name">${c.name}</span><span class="n">${issues.reduce((a, i) => a + countFor(i.id), 0)}</span></label>
        ${Object.entries(bySub).map(([sid, list]) => `${subById[sid].leaf ? "" : `<div class="subl">${subById[sid].name}</div>`}<div class="subs">${list.map(i => chip("issue", i.id, `${i.name} · ${countFor(i.id)}`, f.issues.has(i.id))).join("")}</div>`).join("")}
      </div>`;
    }).join("");
    const fe = filteredEdges();
    $aside.innerHTML = `
      <div class="h" style="margin-top:8px">Search</div><input class="search" id="q" placeholder="legislator or issue…" value="${f.q}">
      <div class="h">State</div><div class="field"><select id="f-state"><option value="">All states</option>${STATES.map(s => `<option ${f.state === s ? "selected" : ""}>${s}</option>`).join("")}</select></div>
      <div class="h">Issues of interest <span><a id="all">all</a>&nbsp;<a id="none">none</a></span></div>${groups}
      <div class="h">Party</div><div class="subs">${chip("d party", "D", "Democrat", f.parties.has("D"))}${chip("r party", "R", "Republican", f.parties.has("R"))}</div>
      <div class="h">Stance</div><div class="subs">${["support", "oppose", "neutral"].map(d => chip(d + " dir", d, d, f.dirs.has(d))).join("")}</div>
      <div class="h">Min. LLM confidence</div><div class="subs">${CONF.map((c, i) => chip("conf", i, c, f.minConf === i)).join("")}</div>
      <div class="stat">${fe.length} stances · ${new Set(fe.map(e => e.from)).size} legislators · ${new Set(fe.map(e => e.to)).size} issues</div>`;
    $aside.querySelectorAll("input[data-cat]").forEach(cb => { if (cb.dataset.ind) cb.indeterminate = true; cb.onchange = () => { ISSUES.filter(i => i.cat === cb.dataset.cat).forEach(i => cb.checked ? f.issues.add(i.id) : f.issues.delete(i.id)); render(); }; });
    $aside.querySelectorAll(".chip").forEach(el => el.onclick = () => { const k = el.dataset.k, id = el.dataset.id;
      if (k.includes("issue")) toggle(f.issues, id); else if (k.includes("chamber")) toggle(f.chambers, id); else if (k.includes("party")) toggle(f.parties, id); else if (k.includes("dir")) toggle(f.dirs, id); else if (k.includes("conf")) f.minConf = +id; render(); });
    $("all").onclick = () => { ISSUES.forEach(i => f.issues.add(i.id)); render(); };
    $("none").onclick = () => { f.issues.clear(); render(); };
    $("f-state").onchange = e => { f.state = e.target.value; render(); };
    const q = $("q"); q.oninput = () => { f.q = q.value; renderGraph(); renderSide(); const fe2 = filteredEdges(); $aside.querySelector(".stat").textContent = `${fe2.length} stances · ${new Set(fe2.map(e => e.from)).size} legislators · ${new Set(fe2.map(e => e.to)).size} issues`; };
  }
  function renderExploreSide() {
    const fe = filteredEdges();
    if (state.person && byId[state.person]) {
      const p = byId[state.person], mine = fe.filter(e => e.from === p.id).sort((a, b) => b.score - a.score);
      const sel = state.edge && mine.find(e => e.to === state.edge) || mine[0];
      $side.innerHTML = `<div class="person-card"><div class="name">${title(p)}</div><div class="meta">${seat(p)} · ${p.party} · ${mine.length} stances in view</div>
        ${mine.map(e => `<div class="stance-line ${sel === e ? "active" : ""}" data-issue="${e.to}"><div><div class="t">${issueById[e.to].name}</div><div class="c">${issueById[e.to].catName} › ${issueById[e.to].subName}</div></div><div class="score" style="color:${color(e.direction)}">${fmt(e.score)}</div></div>`).join("")}
        ${sel ? evidenceHtml(sel) : ""}<div style="margin-top:12px;display:flex;gap:8px"><button class="btn" id="back">← all legislators</button><button class="btn" data-open="${p.id}">Open profile →</button></div></div>`;
      $side.querySelectorAll(".stance-line").forEach(el => el.onclick = () => { state.edge = el.dataset.issue; renderSide(); });
      $("back").onclick = () => { state.person = null; state.edge = null; render(); };
      return;
    }
    const byP = {}; fe.forEach(e => (byP[e.from] ??= []).push(e));
    const rows = Object.entries(byP).sort((a, b) => b[1].length - a[1].length).map(([pid, es]) => { const p = byId[pid];
      return `<div class="row" data-id="${pid}"><div><div class="name">${title(p)}</div><div class="meta">${seat(p)} · ${p.party} · <span style="color:var(--support)">${es.filter(e => e.direction === "support").length} for</span> · <span style="color:var(--oppose)">${es.filter(e => e.direction === "oppose").length} against</span></div></div><div class="score">${es.length}</div></div>`; }).join("");
    $side.innerHTML = `<div class="topic-sub">${fe.length} stances across ${Object.keys(byP).length} legislators. Click one to see their positions.</div>${rows || `<div class="empty-state">Nothing matches the filters.</div>`} ${conditionsPanel(state.issue)}`;
    $side.querySelectorAll(".row").forEach(el => el.onclick = () => { state.person = el.dataset.id; state.edge = null; render(); });
  }
  const fmt = s => (s > 0 ? "+" : "") + s.toFixed(2);
  // Direction ribbon: a time band colored by the direction held at each moment; flips show as color changes.
  function ribbon(st, W = 300, H = 22, labels = true) {
    const dated = st.filter(s => s.date); if (dated.length < 2) return "";
    const t0 = new Date(dated[0].date), t1 = new Date(dated[dated.length - 1].date), span = Math.max(1, t1 - t0);
    const x = d => 6 + (new Date(d) - t0) / span * (W - 12);
    const segs = dated.map((s, k) => { const x0 = x(s.date), x1 = k < dated.length - 1 ? x(dated[k + 1].date) : W - 6; return `<rect x="${x0}" y="${H / 2 - 5}" width="${Math.max(2, x1 - x0)}" height="10" fill="${color(s.direction)}" fill-opacity="${.35 + Math.abs(s.score) * .6}"/>`; }).join("");
    const dots = dated.map(s => `<circle cx="${x(s.date)}" cy="${H / 2}" r="4" fill="${color(s.direction)}" stroke="var(--bg)" stroke-width="1.5"><title>${s.date} · ${s.direction} ${fmt(s.score)}</title></circle>`).join("");
    const lab = labels ? `<text x="6" y="${H - 1}" font-size="9" fill="var(--muted)">${dated[0].date}</text><text x="${W - 6}" y="${H - 1}" font-size="9" fill="var(--muted)" text-anchor="end">${dated[dated.length - 1].date}</text>` : "";
    return `<svg width="${W}" height="${H + (labels ? 10 : 0)}" style="vertical-align:middle;display:block">${segs}${dots}${lab}</svg>`;
  }
  function evidenceHtml(e, hlId) {
    const i = issueById[e.to], st = e.statements;
    const head = `<div style="font-weight:600">${title(byId[e.from])} on ${i.name}</div><div style="font-size:11px;color:var(--muted)">${i.catName} › ${i.subName}</div>
      <div class="tags" style="margin-top:6px"><span class="tag" style="color:${color(e.direction)}">${e.direction} · ${fmt(e.score)}</span><span class="tag">${e.n} statement${e.n > 1 ? "s" : ""}</span><span class="tag" title="attention: recency-weighted statement count, percentile across all edges">🔥 ${Math.round(e.heat * 100)}th pct</span>${e.flip ? `<span class="tag" style="border-color:var(--accent);color:var(--accent)">⟲ flipped</span>` : ""}<span class="tag c-${e.llm_confidence}">confidence: ${e.llm_confidence}</span></div>
      ${e.n > 1 ? `<div style="margin-top:8px;font-size:11px;color:var(--muted)">direction over time</div>${ribbon(st, 300)}` : ""}`;
    const items = [...st].reverse().map(s => `<div class="stmt ${hlId && s.statement_id === hlId ? "hl" : ""}" style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border)"><div style="font-size:11px;color:var(--muted)">${s.statement_id ? `<span class="tag" style="padding:0 5px">${s.statement_id.replace(/^st0*/, "#")}</span> · ` : ""}${s.date || "undated"} · <span style="color:${color(s.direction)}">${s.direction} ${fmt(s.score)}</span> · <span class="tag c-${s.llm_confidence}" style="padding:0 5px">${s.llm_confidence}</span></div>
      <blockquote>“${s.quote}”</blockquote><div style="font-size:12px;color:var(--muted)">${s.bill && billId(s.bill) ? `<a class="link" href="#/bill/${billId(s.bill)}">${s.bill} ↗</a>` : (s.bill || "")} · linkage ${s.linkage} · ${s.model || ""}</div><a href="${s.source}" target="_blank" rel="noopener">source ↗</a></div>`).join("");
    return `<div class="evidence">${head}${items}</div>`;
  }

  // bill-grouped demand panel (2.3): "What it would take" for one issue; "" when the issue has no rows
  function conditionsPanel(issueId) {
    const rows = condByIssue[issueId] || [];
    if (!rows.length) return "";
    // bills = distinct billId over stances of this issue + condition rows of this issue
    const per = new Map();
    STATEMENTS.filter(s => s.issue === issueId && s.bill && billId(s.bill)).forEach(s => { const id = billId(s.bill); if (!per.has(id)) per.set(id, { stmts: [], conds: [] }); per.get(id).stmts.push(s); });
    rows.filter(r => r.bill && billId(r.bill)).forEach(r => { const id = billId(r.bill); if (!per.has(id)) per.set(id, { stmts: [], conds: [] }); per.get(id).conds.push(r); });
    if (!per.size) return "";
    const groups = [...per.entries()].map(([id, g]) => {
      // title = text after the bill number from the latest statement, else the bill string
      const latest = g.stmts.slice().sort((a, b) => String(a.date || "").localeCompare(String(b.date || ""))).pop();
      const chosen = latest ? latest.bill : g.conds[0].bill;
      const m = /^\s*([A-Za-z.]+\s*\d+)\s*(.*)$/.exec(chosen || "");
      const num = m ? m[1].replace(/\s+/g, " ") : (chosen || id), title = m ? m[2].trim() : "";
      const onBill = rows.filter(r => billId(r.bill) === id);
      const chips = [...new Set(onBill.map(r => r.demand))].map(d => { const def = DEMANDS[d] || {}, mine = onBill.filter(r => r.demand === d);
        const wins = mine.filter(r => r.stance_if_met === "support").length, loses = mine.filter(r => r.stance_if_met === "oppose").length;
        const lines = mine.map(r => `<div><b>${byId[r.person].name}</b> ${phrase(nowOf(r.person, r.issue), r)}</div>`).join("");
        return `<button class="chip cond-chip" data-issue="${issueId}" data-demand="${d}" data-bill="${id}" data-people="${mine.map(r => r.person).join(" ")}" style="display:block;width:100%;text-align:left;margin:6px 0"><div style="font-weight:600">${def.name || d}</div><div style="font-size:11px;color:var(--muted)">${def.type || ""} · wins ${wins} · loses ${loses}</div><div style="font-size:12px;margin-top:4px">${lines}</div></button>`; }).join("");
      return `<div style="margin-top:12px;border-top:1px solid var(--border);padding-top:10px"><div style="font-weight:700">${num}${title ? ` <span style="font-weight:400;color:var(--muted)">${title}</span>` : ""}</div><a href="#/bill/${id}" style="color:var(--accent);font-size:12px">bill page ↗</a>${chips}</div>`;
    }).join("");
    return `<div class="h" style="margin-top:16px">What it would take</div>${groups}`;
  }
  // chip hover: edges of the chip's legislators on this issue go full opacity, other edges of the issue dim; leaving restores
  function bindCondChips() {
    $side.querySelectorAll(".cond-chip").forEach(ch => {

        graphLinkSel.attr("stroke-opacity", l => l.e.to === issue ? (set.has(l.e.from) ? .95 : .08) : ((l.main ? .45 : .15) + Math.abs(l.e.score) * .45)); });
      ch.addEventListener("mouseleave", () => { if (!graphLinkSel) return;
        graphLinkSel.attr("stroke-opacity", l => (l.main ? .45 : .15) + Math.abs(l.e.score) * .45); });
    });
  }

  // ---------- FOCUS ----------
  function renderFocusAside() {
    const cats = COMMITTEES.filter(c => ISSUES.some(i => i.cat === c.id && countFor(i.id) > 0)).map(c => `<div class="cat ${state.cat === c.id ? "active" : ""}" data-id="${c.id}"><span>${c.name}</span><span class="n">${ISSUES.filter(i => i.cat === c.id).reduce((a, i) => a + countFor(i.id), 0)}</span></div>`).join("");

    $aside.querySelectorAll(".cat").forEach(el => el.onclick = () => { state.cat = el.dataset.id; const i = ISSUES.find(i => i.cat === state.cat && countFor(i.id) > 0); state.sub = i ? i.sub : null; state.issue = i ? i.id : null; state.person = null; render(); });

  function renderFocusSide() {

  // ---------- LIST ----------
  function listRows() {
    const L = state.l;
    return EDGES.filter(e => { const p = byId[e.from], i = issueById[e.to];
      return (!L.chamber || p.chamber === L.chamber) && (!L.state || p.state === L.state) && (!L.cat || i.cat === L.cat) && (!L.sub || i.sub === L.sub) && (!L.issue || e.to === L.issue)
        && (!L.dir || e.direction === L.dir) && (!L.party || p.party === L.party) && (!L.gender || p.gender === L.gender) && CONF.indexOf(e.llm_confidence) >= L.minConf; })
      .map(e => ({ e, p: byId[e.from], i: issueById[e.to] }));

  function renderListAside() {

    const F = (id, label, options) => `<div class="field"><label>${label}</label><select id="${id}">${options}</select></div>`;
    $aside.innerHTML = `<div class="h" style="margin-top:8px">Find legislators</div>

      ${F("l-cat", "Committee", opt("", "Any committee", L.cat) + cats.map(c => opt(c.id, c.name, L.cat)).join(""))}
      ${F("l-sub", "Subcommittee", opt("", "Any subcommittee", L.sub) + subs.map(s => opt(s.id, s.name, L.sub)).join(""))}
      ${F("l-issue", "Issue", opt("", "Any issue", L.issue) + issues.map(i => opt(i.id, i.name, L.issue)).join(""))}
      ${F("l-dir", "Stance", opt("", "Any stance", L.dir) + ["support", "oppose", "neutral"].map(d => opt(d, d[0].toUpperCase() + d.slice(1), L.dir)).join(""))}
      ${F("l-party", "Party", opt("", "Any party", L.party) + opt("D", "Democrat", L.party) + opt("R", "Republican", L.party) + opt("I", "Independent", L.party))}
      ${F("l-gender", "Gender", opt("", "Any", L.gender) + opt("F", "Female", L.gender) + opt("M", "Male", L.gender))}
      ${F("l-conf", "Min. LLM confidence", CONF.map((c, i) => opt(i, c, L.minConf)).join(""))}
      <div class="field"><button class="btn" id="l-reset">Reset filters</button></div>`;
    const bind = (id, key, num) => { const el = $(id); el.onchange = () => { L[key] = num ? +el.value : el.value; if (key === "cat") { L.sub = ""; L.issue = ""; } if (key === "sub") L.issue = ""; L.sel = null; render(); }; };
    ["state", "cat", "sub", "issue", "dir", "party", "gender"].forEach(k => bind("l-" + k, k)); bind("l-conf", "minConf", true);
    $("l-reset").onclick = () => { Object.assign(L, { chamber: "", state: "", cat: "", sub: "", issue: "", dir: "", party: "", gender: "", minConf: 0, sel: null }); render(); };
  }
  function renderTable() {

    rows.sort((a, b) => { const x = key(a), y = key(b); const c = typeof x === "number" ? x - y : String(x).localeCompare(String(y)); return L.desc ? -c : c; });
    const th = (k, label) => `<th data-k="${k}" class="${L.sort === k ? "sorted" : ""}">${label}${L.sort === k ? (L.desc ? " ↓" : " ↑") : ""}</th>`;
    wrap.innerHTML = `<div class="toolbar"><span>${rows.length} stances · ${new Set(rows.map(r => r.p.id)).size} legislators</span><button class="btn" id="csv">Export CSV</button></div>
      <table><thead><tr>${th("name", "Legislator")}${th("state", "District")}${th("party", "Party")}${th("gender", "Gender")}${th("issue", "Issue")}<th>Committee</th><th>Stance</th>${th("score", "Score")}${th("n", "Stmts")}${th("conf", "Confidence")}<th>Latest quote</th></tr></thead>
      <tbody>${rows.map((r, k) => `<tr data-i="${k}" class="${L.sel === r.e ? "active" : ""}"><td><b>${r.p.name}</b></td><td>${seat(r.p)}</td><td><span class="pill ${r.p.party}">${r.p.party}</span></td><td>${r.p.gender}</td><td>${r.i.name}<div style="font-size:11px;color:var(--muted)">${r.i.subName}</div></td><td style="color:var(--muted)">${r.i.catName}</td><td><span class="pill ${r.e.direction}">${r.e.direction}</span></td><td class="score" style="color:${color(r.e.direction)}">${fmt(r.e.score)}</td><td style="text-align:center">${r.e.n}${r.e.flip ? ' <span style="color:var(--accent)" title="position changed over time">⟲</span>' : ""}</td><td><span class="tag c-${r.e.llm_confidence}">${r.e.llm_confidence}</span></td><td class="quote" title="${r.e.quote.replace(/"/g, "&quot;")}">“${r.e.quote}”</td></tr>`).join("") || `<tr><td colspan="11" class="empty-state">No legislators match.</td></tr>`}</tbody></table>`;

    $("csv").onclick = () => { const h = ["name", "state", "district", "party", "gender", "issue", "subcommittee", "committee", "direction", "score", "statements", "flipped", "first_date", "last_date", "linkage", "llm_confidence", "latest_bill", "latest_quote", "latest_source"];
      const lines = [h.join(",")].concat(rows.map(r => [r.p.name, r.p.state, r.p.district || "", r.p.party, r.p.gender, r.i.name, r.i.subName, r.i.catName, r.e.direction, r.e.score.toFixed(3), r.e.n, r.e.flip, r.e.first || "", r.e.last || "", r.e.linkage, r.e.llm_confidence, r.e.bill || "", r.e.quote, r.e.source].map(v => `"${String(v).replace(/"/g, '""')}"`).join(",")));

  function renderListSide() {

  }

  // ---------- PROFILE (one page per legislator) ----------
  const openProfile = id => { state.mode = "profile"; state.p.person = id; state.p.sel = null; state.p.hl = null; state.p.open = null; history.replaceState(null, "", `#/legislator/${id}`); render(); };
  const profileBtn = id => `<div style="margin-top:10px"><button class="btn" data-open="${id}">Open profile →</button></div>`;

  function renderProfileAside() {

  function partyMean(issue, party) { const xs = EDGES.filter(e => e.to === issue && byId[e.from].party === party).map(e => e.score); return xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : null; }
  function renderProfile() {
    const wrap = $("profile"), P = state.p, p = byId[P.person];
    if (!p) { wrap.innerHTML = `<div class="empty-state">Pick a legislator on the left.</div>`; return; }
    const mine = EDGES.filter(e => e.from === p.id).map(e => ({ e, i: issueById[e.to] }));

    const tab = P.tab || "overview";
    // Conditions block (2.4): one row per condition, stance-first short phrase; hidden when empty

    const condBlock = condRows.length ? `<div class="h" style="margin:16px 0 4px">Conditions</div>` + condRows.map(r => {
      const dot = r.stance_if_met === "support" ? "var(--support)" : "var(--oppose)", dtype = (DEMANDS[r.demand] || {}).type || "";
      return `<div style="display:flex;gap:10px;margin:10px 0"><span style="width:10px;height:10px;border-radius:50%;background:${dot};flex:none;margin-top:5px"></span><div><div>${condShort(nowOf(r.person, r.issue), r)}</div><div style="font-size:11px;color:var(--muted);margin-top:2px">${r.bill && billId(r.bill) ? `<a class="link" href="#/bill/${billId(r.bill)}">${r.bill} ↗</a> · ` : (r.bill ? `${r.bill} · ` : "")}<span class="tag">${dtype}</span></div><div class="cond-q">“${r.quote}”</div></div></div>`;

      <div id="tab-overview" class="tabpane" ${tab !== "overview" ? "hidden" : ""}>
        <div class="pgrid">
          <div class="card"><h3>Attention map</h3><div class="sub">Where they stand (x) vs how much they talk about it (y). Top corners = loud supporter / loud opponent; bottom = on record but rarely raised. Gold ring = position changed.</div><svg id="pscatter" viewBox="0 0 270 230" style="width:100%;height:auto;max-width:520px"></svg></div>

      const edges = EDGES.filter(e => e.to === i.id), persons = [...new Set(edges.map(e => e.from))];
      const other = EDGES.filter(e => e.to !== i.id && persons.includes(e.from)), topics = [...new Set(other.map(e => e.to))];
      return { nodes: [{ id: i.id, kind: "topic", name: i.name, main: true, cat: i.cat }, ...persons.map(id => ({ id, kind: "person", name: byId[id].name.replace(/^(Rep|Sen)\. /, "") })), ...topics.map(id => ({ id, kind: "topic", name: issueById[id].name, main: false, cat: issueById[id].cat }))],
        links: [...edges.map(e => ({ source: e.from, target: e.to, e, main: true })), ...other.map(e => ({ source: e.from, target: e.to, e, main: false }))] };
    }
    const fe = filteredEdges(), persons = [...new Set(fe.map(e => e.from))], topics = [...new Set(fe.map(e => e.to))];
    return { nodes: [...topics.map(id => ({ id, kind: "topic", name: issueById[id].name, main: true, cat: issueById[id].cat })), ...persons.map(id => ({ id, kind: "person", name: byId[id].name.replace(/^(Rep|Sen)\. /, "") }))], links: fe.map(e => ({ source: e.from, target: e.to, e, main: true })) };
  }
  function renderGraph() {
    const list = state.mode === "list", prof = state.mode === "profile", bill = state.mode === "bill";
    $("table-wrap").style.display = list ? "block" : "none"; $("profile").style.display = prof ? "block" : "none"; $("bill").style.display = bill ? "block" : "none";
    svg.style("display", list || prof || bill ? "none" : "block"); $("legend").style.display = list || prof || bill ? "none" : "flex";
    if (list) { sim && sim.stop(); return renderTable(); }
    if (prof) { sim && sim.stop(); return renderProfile(); }
    if (bill) { sim && sim.stop(); return renderBill(); }
    g.selectAll("*").remove();
    const { nodes, links } = buildGraphData(), { width, height } = svg.node().getBoundingClientRect(), explore = state.mode === "explore";
    const deg = {}; links.forEach(l => { deg[l.source] = (deg[l.source] || 0) + 1; deg[l.target] = (deg[l.target] || 0) + 1; });
    sim && sim.stop();
    sim = d3.forceSimulation(nodes)
      .force("link", d3.forceLink(links).id(d => d.id).distance(l => explore ? 90 : (l.main ? 150 : 110)).strength(l => l.main ? .7 : .25))
      .force("charge", d3.forceManyBody().strength(explore ? -260 : -380)).force("center", d3.forceCenter(width / 2, height / 2)).force("collide", d3.forceCollide(d => d.kind === "topic" ? 40 : 22));
    const link = g.append("g").selectAll("line").data(links).join("line").attr("stroke", d => color(d.e.direction)).attr("stroke-width", d => heatW(d.e.heat)).attr("stroke-opacity", d => (d.main ? .45 : .15) + Math.abs(d.e.score) * .45).attr("stroke-dasharray", d => d.e.flip ? "7 4" : null);
    link.append("title").text(d => `${byId[d.e.from].name} on ${issueById[d.e.to].name}: ${d.e.direction} ${fmt(d.e.score)} · ${d.e.n} statement${d.e.n > 1 ? "s" : ""} · attention ${Math.round(d.e.heat * 100)}th pct${d.e.flip ? " · flipped" : ""}`);
    const node = g.append("g").selectAll("g").data(nodes).join("g").style("cursor", "pointer")
      .call(d3.drag().on("start", (ev, d) => { if (!ev.active) sim.alphaTarget(.3).restart(); d.fx = d.x; d.fy = d.y; }).on("drag", (ev, d) => { d.fx = ev.x; d.fy = ev.y; }).on("end", (ev, d) => { if (!ev.active) sim.alphaTarget(0); d.fx = null; d.fy = null; }))
      .on("click", (ev, d) => { if (d.kind === "person") { openProfile(d.id); } else { const i = issueById[d.id]; if (explore || !d.main) { state.mode = "focus"; state.cat = i.cat; state.sub = i.sub; state.issue = i.id; state.person = null; render(); } } })
      .on("mouseenter", (ev, d) => highlight(d)).on("mouseleave", () => highlight(null));
    node.filter(d => d.kind === "topic").append("circle").attr("r", d => explore ? 14 + Math.min(16, (deg[d.id] || 0) * 2) : 18).attr("fill", d => d.main ? CAT_HUE[d.cat] : "var(--border)").attr("fill-opacity", d => d.main ? .9 : 1).attr("stroke", d => d.main ? "#fff" : "var(--border-strong)").attr("stroke-width", 1.5);
    node.filter(d => d.kind === "person").append("circle").attr("r", d => state.person === d.id ? 14 : (byId[d.id].chamber === "senate" ? 11 : 9))
      .attr("fill", d => { if (explore) return partyColor(byId[d.id].party); const e = links.find(l => l.main && (l.source.id ?? l.source) === d.id); return e ? color(e.e.direction) : "var(--neutral)"; })
      .attr("stroke", d => state.person === d.id ? "#fff" : (byId[d.id].chamber === "senate" ? "var(--accent)" : "var(--bg)")).attr("stroke-width", 2);
    node.append("text").attr("class", d => "node-label" + (d.kind === "topic" ? " topic" : "")).attr("text-anchor", "middle").attr("dy", d => d.kind === "topic" ? (explore ? 36 : 5) : 22).text(d => d.name);
    // condition markers (2.2): amber diamond at the midpoint of edges with rows; existing edge styling untouched
    const condLinks = links.filter(l => (condByPI[l.e.from + "|" + l.e.to] || []).length);
    const markers = g.append("g").selectAll("path").data(condLinks).join("path")
      .attr("d", d3.symbol(d3.symbolDiamond, 70)).attr("fill", "var(--accent)").attr("stroke", "var(--bg)").attr("stroke-width", 1.5)
      .style("cursor", "pointer").style("pointer-events", "all")
      .on("mousemove", (ev, l) => { const rows = condByPI[l.e.from + "|" + l.e.to] || [];
        condTip.style.display = "block"; condTip.style.left = (ev.clientX + 14) + "px"; condTip.style.top = (ev.clientY + 10) + "px";
        condTip.innerHTML = rows.map(r => `<div><b>${byId[r.person].name}</b> ${phrase(l.e.score, r)}<div class="cond-q">“${r.quote}”</div></div>`).join(`<hr style="border:0;border-top:1px solid var(--border);margin:6px 0">`); })
      .on("mouseleave", () => { condTip.style.display = "none"; });
    graphLinkSel = link;
    function highlight(d) {
      if (!d) { node.attr("opacity", 1); link.attr("stroke-opacity", l => (l.main ? .45 : .15) + Math.abs(l.e.score) * .45); return; }
      const near = new Set([d.id]); links.forEach(l => { if (l.source.id === d.id) near.add(l.target.id); if (l.target.id === d.id) near.add(l.source.id); });
      node.attr("opacity", n => near.has(n.id) ? 1 : .15); link.attr("stroke-opacity", l => l.source.id === d.id || l.target.id === d.id ? .95 : .05);
    }
    sim.on("tick", () => { link.attr("x1", d => d.source.x).attr("y1", d => d.source.y).attr("x2", d => d.target.x).attr("y2", d => d.target.y); node.attr("transform", d => `translate(${d.x},${d.y})`); markers.attr("transform", d => `translate(${(d.source.x + d.target.x) / 2},${(d.source.y + d.target.y) / 2})`); });
  }

  // ---------- shell ----------
  function renderHeader() {
    ["explore", "focus", "list", "profile"].forEach(m => $("m-" + m).classList.toggle("active", state.mode === m));
    if (state.mode === "profile") { const p = byId[state.p.person]; $crumb.innerHTML = p ? `<b>${p.name}</b> · ${seat(p)}` : `<b>Legislators</b>`; $hint.textContent = ""; }
    else if (state.mode === "bill") { const info = billInfo(state.b.id); $crumb.innerHTML = info ? `<b>${info.num}</b> · ${info.title || "Bill"}` : `<b>Bill</b> · not found`; $hint.textContent = ""; }
    else if (state.mode === "list") { $crumb.innerHTML = `<b>Legislator list</b> · dropdown filters`; $hint.textContent = ""; }
    else if (state.mode === "explore") { $crumb.innerHTML = `<b>All issues</b> · filtered view`; $hint.textContent = "Tick issues on the left to filter · hover to see connections · click an issue to focus · click a legislator to open their page"; }
    else { const i = issueById[state.issue]; $crumb.innerHTML = i ? `<b>${i.catName}</b> › ${i.subName} › <b>${i.name}</b>` : "Pick an issue"; $hint.textContent = "Drag nodes · click a legislator to open their page · grey issues = what these legislators also talk about"; }
  }
  function renderAside() { ({ explore: renderExploreAside, focus: renderFocusAside, list: renderListAside, profile: renderProfileAside, bill: renderBillAside })[state.mode](); }
  function renderSide() {
    const hasEvidence = state.mode === "focus" ? !!state.person : state.mode === "explore" ? !!state.person : state.mode === "list" ? !!state.l.sel : !!state.p.sel;
    $side.dataset.label = hasEvidence ? "Evidence" : state.mode === "explore" ? "In view" : "Notes";
    ({ explore: renderExploreSide, focus: renderFocusSide, list: renderListSide, profile: renderProfileSide, bill: renderBillSide })[state.mode]();
    $side.querySelectorAll("[data-open]").forEach(b => b.onclick = () => openProfile(b.dataset.open));
    bindCondChips();
  }
  function render() { renderHeader(); renderAside(); renderSide(); renderGraph(); if (!["profile", "bill"].includes(state.mode) && /^#\/(legislator|bill)\//.test(location.hash)) history.replaceState(null, "", location.pathname); }
  ["explore", "focus", "list", "profile"].forEach(m => $("m-" + m).onclick = () => { state.mode = m; state.person = null; render(); });
  $("brand").onclick = e => { e.preventDefault(); state.mode = "explore"; state.person = null; render(); };
  window.addEventListener("hashchange", () => {
    let m = /^#\/legislator\/([\w-]+)/.exec(location.hash);
    if (m && byId[m[1]]) { state.mode = "profile"; state.p.person = m[1]; state.p.sel = null; render(); return; }
    m = /^#\/bill\/([\w-]+)/.exec(location.hash);
    if (m) { state.mode = "bill"; state.b.id = m[1]; state.b.ticked = []; state.b.sel = null; render(); }
  });
  render();
  window.addEventListener("resize", renderGraph);
})();
</script>
</body>
