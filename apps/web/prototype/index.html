<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OWL Prototype</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel-2: #1e222b; --border: #2a2f3a;
    --text: #e6e8ee; --muted: #8b93a7; --accent: #8b5cf6;
    --support: #22c55e; --oppose: #ef4444; --neutral: #9ca3af;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 -apple-system, "Segoe UI", Inter, Roboto, sans-serif; }
  .app { display: grid; grid-template-columns: 260px 1fr 360px; grid-template-rows: 48px 1fr; height: 100vh; }
  header { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; padding: 0 16px;
    border-bottom: 1px solid var(--border); background: var(--panel); }
  header .brand { font-weight: 700; letter-spacing: .3px; }
  header .crumb { color: var(--muted); font-size: 13px; }
  header .crumb b { color: var(--text); font-weight: 600; }
  .modes { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-left: 8px; }
  .modes button { background: transparent; border: 0; color: var(--muted); padding: 5px 12px; cursor: pointer; font: inherit; font-size: 12px; }
  .modes button.active { background: var(--accent); color: white; }
  header .mock { margin-left: auto; font-size: 11px; padding: 3px 8px; border: 1px solid #b45309; color: #fbbf24; border-radius: 999px; }
  aside, section, .side { overflow: auto; }
  aside { border-right: 1px solid var(--border); background: var(--panel); padding: 10px 12px 20px; }
  .h { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 14px 4px 6px; display: flex; justify-content: space-between; }
  .h a { color: var(--accent); cursor: pointer; text-transform: none; letter-spacing: 0; font-size: 11px; }
  .cat { padding: 8px 10px; border-radius: 8px; cursor: pointer; color: var(--text); display: flex; justify-content: space-between; }
  .cat:hover { background: var(--panel-2); }
  .cat.active { background: rgba(139,92,246,.18); color: #c4b5fd; }
  .cat .n { color: var(--muted); font-size: 12px; }
  .subs { display: flex; flex-wrap: wrap; gap: 6px; padding: 2px 4px 4px; }
  .chip { font-size: 12px; padding: 4px 10px; border: 1px solid var(--border); border-radius: 999px; cursor: pointer; color: var(--muted); user-select: none; }
  .chip:hover { border-color: var(--accent); color: var(--text); }
  .chip.active { background: var(--accent); border-color: var(--accent); color: white; }
  .chip.empty { opacity: .4; cursor: default; }
  .chip.d.active { background: #2563eb; border-color: #2563eb; }
  .chip.r.active { background: #dc2626; border-color: #dc2626; }
  .chip.support.active { background: var(--support); border-color: var(--support); color: #052e16; }
  .chip.oppose.active { background: var(--oppose); border-color: var(--oppose); }
  .chip.neutral.active { background: var(--neutral); border-color: var(--neutral); color: #111; }
  .search { width: 100%; background: var(--panel-2); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 7px 10px; font: inherit; font-size: 13px; outline: none; }
  .search:focus { border-color: var(--accent); }
  .group { margin: 4px 4px 0; }
  .group .gh { display: flex; align-items: center; gap: 8px; padding: 6px 6px; border-radius: 8px; cursor: pointer; }
  .group .gh:hover { background: var(--panel-2); }
  .group .gh .sw { width: 10px; height: 10px; border-radius: 3px; }
  .group .gh .name { flex: 1; font-weight: 600; font-size: 13px; }
  .group .gh .n { color: var(--muted); font-size: 11px; }
  .group .gh input { accent-color: var(--accent); }
  .group .subs { padding-left: 24px; }
  .stat { font-size: 12px; color: var(--muted); margin: 10px 4px 0; }
  section { position: relative; }
  svg { width: 100%; height: 100%; display: block; }
  .legend { position: absolute; left: 14px; bottom: 12px; display: flex; gap: 14px; font-size: 12px; color: var(--muted);
    background: rgba(23,26,33,.85); padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
  .hint { position: absolute; left: 14px; top: 12px; font-size: 12px; color: var(--muted); }
  .side { border-left: 1px solid var(--border); background: var(--panel); padding: 14px; }
  .topic-title { font-size: 18px; font-weight: 700; margin: 0 0 2px; }
  .topic-sub { color: var(--muted); font-size: 12px; margin-bottom: 12px; }
  .spectrum { height: 8px; border-radius: 999px; background: linear-gradient(90deg, var(--oppose), #4b5563 50%, var(--support)); position: relative; margin: 6px 0 14px; }
  .spectrum .tick { position: absolute; top: -4px; width: 4px; height: 16px; border-radius: 2px; background: white; opacity: .85; transform: translateX(-2px); }
  .row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 8px 8px; border-radius: 8px; cursor: pointer; }
  .row:hover, .row.active { background: var(--panel-2); }
  .row .name { font-weight: 600; }
  .row .meta { color: var(--muted); font-size: 12px; }
  .bar { height: 6px; border-radius: 999px; background: #2a2f3a; position: relative; margin-top: 5px; overflow: hidden; }
  .bar > span { position: absolute; top: 0; bottom: 0; }
  .score { font-family: var(--mono); font-size: 12px; min-width: 44px; text-align: right; }
  .evidence { margin-top: 14px; padding: 12px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px; }
  .evidence blockquote { margin: 8px 0; padding-left: 10px; border-left: 3px solid var(--accent); color: #d1d5db; font-style: italic; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .tag { font-size: 11px; padding: 2px 7px; border-radius: 6px; border: 1px solid var(--border); color: var(--muted); font-family: var(--mono); }
  .tag.c-high, .tag.c-super_high { border-color: #166534; color: #86efac; }
  .tag.c-mid { border-color: #854d0e; color: #fde047; }
  .tag.c-low { border-color: #7f1d1d; color: #fca5a5; }
  .evidence a { color: #a78bfa; font-size: 12px; }
  .empty-state { color: var(--muted); padding: 20px 8px; }
  .node-label { font-size: 11px; fill: #cbd5e1; pointer-events: none; }
  .node-label.topic { font-size: 12px; font-weight: 700; fill: #f3f4f6; }
  .person-card { padding: 10px 8px; border-radius: 8px; }
  .person-card .name { font-weight: 700; font-size: 16px; }
  .person-card .meta { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
  .stance-line { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 6px 8px; border-radius: 8px; cursor: pointer; }
  .stance-line:hover, .stance-line.active { background: var(--panel-2); }
  .stance-line .t { font-size: 13px; }
  .stance-line .c { font-size: 11px; color: var(--muted); }
  .btn { background: var(--panel-2); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 5px 10px; font: inherit; font-size: 12px; cursor: pointer; }
  .btn:hover { border-color: var(--accent); }
  /* list mode */
  .field { margin: 0 4px 10px; }
  .field label { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px; }
  .field select { width: 100%; background: var(--panel-2); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 7px 8px; font: inherit; font-size: 13px; }
  .field select:focus { outline: none; border-color: var(--accent); }
  #table-wrap { position: absolute; inset: 0; overflow: auto; padding: 14px; display: none; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { position: sticky; top: 0; background: var(--panel); color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; cursor: pointer; user-select: none; }
  th.sorted { color: var(--text); }
  tbody tr { cursor: pointer; }
  tbody tr:hover, tbody tr.active { background: var(--panel-2); }
  td.quote { max-width: 360px; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .pill.D { background: rgba(59,130,246,.2); color: #93c5fd; } .pill.R { background: rgba(248,113,113,.2); color: #fca5a5; }
  .pill.support { background: rgba(34,197,94,.18); color: #86efac; } .pill.oppose { background: rgba(239,68,68,.18); color: #fca5a5; } .pill.neutral { background: rgba(156,163,175,.18); color: #d1d5db; }
  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <span class="brand">🦉 OWL</span>
    <span class="modes"><button id="m-explore">Explore</button><button id="m-focus">Focus</button><button id="m-list">List</button></span>
    <span class="crumb" id="crumb"></span>
    <span class="mock">MOCK DATA · fictional legislators</span>
  </header>

  <aside id="aside"></aside>

  <section>
    <div class="hint" id="hint"></div>
    <svg id="graph"></svg>
    <div id="table-wrap"></div>
    <div class="legend" id="legend">
      <span><i style="background:var(--support)"></i>Support</span>
      <span><i style="background:var(--oppose)"></i>Oppose</span>
      <span><i style="background:var(--neutral)"></i>Neutral</span>
      <span style="margin-left:6px">line width = linkage</span>
    </div>
  </section>

  <div class="side" id="side"></div>
</div>

<script src="./mock-data.js"></script>
<script>
(() => {
  const TAX = window.OWL_TAXONOMY, PEOPLE = window.OWL_PEOPLE, EDGES = window.OWL_EDGES;
  const byId = Object.fromEntries(PEOPLE.map(p => [p.id, p]));
  const SUBS = TAX.flatMap(c => c.subs.map(s => ({ ...s, cat: c.id, catName: c.name })));
  const subById = Object.fromEntries(SUBS.map(s => [s.id, s]));
  const CAT_HUE = { public_safety: "#f59e0b", energy: "#06b6d4", healthcare: "#ec4899", immigration: "#84cc16", technology_ai: "#8b5cf6" };
  const attr = (p, k) => (p.attrs.find(a => a.attr === k) || {}).value || "";
  const color = d => d === "support" ? "var(--support)" : d === "oppose" ? "var(--oppose)" : "var(--neutral)";
  const lw = { low: 1, mid: 2, high: 3.5, super_high: 5 };
  const CONF = ["low", "mid", "high", "super_high"];
  const countFor = sub => EDGES.filter(e => e.to === sub).length;

  const state = {
    mode: "explore", cat: "public_safety", sub: "guns", person: null, edge: null,
    f: { subs: new Set(SUBS.filter(s => countFor(s.id) > 0).map(s => s.id)), parties: new Set(["D", "R"]),
         dirs: new Set(["support", "oppose", "neutral"]), minConf: 0, q: "" },
    l: { cat: "", sub: "", dir: "", party: "", gender: "", minConf: 0, sort: "score", desc: true, sel: null }
  };

  const $ = id => document.getElementById(id);
  const $aside = $("aside"), $side = $("side"), $crumb = $("crumb"), $hint = $("hint");

  // ---------- filtered edge set (explore) ----------
  function filteredEdges() {
    const q = state.f.q.trim().toLowerCase();
    return EDGES.filter(e => state.f.subs.has(e.to)
      && state.f.parties.has(attr(byId[e.from], "party"))
      && state.f.dirs.has(e.direction)
      && CONF.indexOf(e.llm_confidence) >= state.f.minConf
      && (!q || byId[e.from].name.toLowerCase().includes(q) || subById[e.to].name.toLowerCase().includes(q)));
  }

  // ---------- list mode ----------
  function listRows() {
    const L = state.l;
    return EDGES.filter(e => {
      const p = byId[e.from], s = subById[e.to];
      return (!L.cat || s.cat === L.cat) && (!L.sub || e.to === L.sub) && (!L.dir || e.direction === L.dir)
        && (!L.party || attr(p, "party") === L.party) && (!L.gender || attr(p, "gender") === L.gender)
        && CONF.indexOf(e.llm_confidence) >= L.minConf;
    }).map(e => ({ e, p: byId[e.from], s: subById[e.to] }));
  }
  function renderListAside() {
    const L = state.l;
    const opt = (v, label, cur) => `<option value="${v}" ${String(cur) === String(v) ? "selected" : ""}>${label}</option>`;
    const subsForCat = (L.cat ? TAX.find(c => c.id === L.cat).subs : SUBS).filter(s => countFor(s.id) > 0);
    $aside.innerHTML = `
      <div class="h" style="margin-top:8px">Find legislators</div>
      <div class="field"><label>Category</label><select id="l-cat">${opt("", "Any category", L.cat)}${TAX.map(c => opt(c.id, c.name, L.cat)).join("")}</select></div>
      <div class="field"><label>Topic</label><select id="l-sub">${opt("", "Any topic", L.sub)}${subsForCat.map(s => opt(s.id, s.name, L.sub)).join("")}</select></div>
      <div class="field"><label>Stance</label><select id="l-dir">${opt("", "Any stance", L.dir)}${["support", "oppose", "neutral"].map(d => opt(d, d[0].toUpperCase() + d.slice(1), L.dir)).join("")}</select></div>
      <div class="field"><label>Party</label><select id="l-party">${opt("", "Any party", L.party)}${opt("D", "Democrat", L.party)}${opt("R", "Republican", L.party)}</select></div>
      <div class="field"><label>Gender</label><select id="l-gender">${opt("", "Any", L.gender)}${opt("F", "Female", L.gender)}${opt("M", "Male", L.gender)}</select></div>
      <div class="field"><label>Min. LLM confidence</label><select id="l-conf">${CONF.map((c, i) => opt(i, c, L.minConf)).join("")}</select></div>
      <div class="field"><button class="btn" id="l-reset">Reset filters</button></div>`;
    const bind = (id, key, num) => { const el = $(id); el.onchange = () => { L[key] = num ? +el.value : el.value; if (key === "cat") L.sub = ""; L.sel = null; render(); }; };
    bind("l-cat", "cat"); bind("l-sub", "sub"); bind("l-dir", "dir"); bind("l-party", "party"); bind("l-gender", "gender"); bind("l-conf", "minConf", true);
    $("l-reset").onclick = () => { Object.assign(L, { cat: "", sub: "", dir: "", party: "", gender: "", minConf: 0, sel: null }); render(); };
  }
  function renderTable() {
    const wrap = $("table-wrap"), L = state.l;
    const rows = listRows();
    const key = { name: r => r.p.name, district: r => attr(r.p, "district"), party: r => attr(r.p, "party"), gender: r => attr(r.p, "gender"), topic: r => r.s.name, score: r => r.e.score, conf: r => CONF.indexOf(r.e.llm_confidence) }[L.sort];
    rows.sort((a, b) => { const x = key(a), y = key(b); const c = typeof x === "number" ? x - y : String(x).localeCompare(String(y)); return L.desc ? -c : c; });
    const th = (k, label) => `<th data-k="${k}" class="${L.sort === k ? "sorted" : ""}">${label}${L.sort === k ? (L.desc ? " ↓" : " ↑") : ""}</th>`;
    const csv = () => { const h = ["name","district","party","gender","topic","category","direction","score","linkage","llm_confidence","bill","quote","source"]; const lines = [h.join(",")].concat(rows.map(r => [r.p.name, attr(r.p,"district"), attr(r.p,"party"), attr(r.p,"gender"), r.s.name, r.s.catName, r.e.direction, r.e.score, r.e.linkage, r.e.llm_confidence, r.e.bill, r.e.quote, r.e.source].map(v => `"${String(v).replace(/"/g, '""')}"`).join(","))); const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([lines.join("\n")], { type: "text/csv" })); a.download = "owl-legislators.csv"; a.click(); };
    wrap.innerHTML = `<div class="toolbar"><span>${rows.length} stances · ${new Set(rows.map(r => r.p.id)).size} legislators</span><button class="btn" id="csv">Export CSV</button></div>
      <table><thead><tr>${th("name", "Legislator")}${th("district", "District")}${th("party", "Party")}${th("gender", "Gender")}${th("topic", "Topic")}<th>Stance</th>${th("score", "Score")}${th("conf", "Confidence")}<th>Quote</th></tr></thead>
      <tbody>${rows.map((r, i) => `<tr data-i="${i}" class="${L.sel === r.e ? "active" : ""}"><td><b>${r.p.name}</b></td><td>${attr(r.p, "district")}</td><td><span class="pill ${attr(r.p, "party")}">${attr(r.p, "party")}</span></td><td>${attr(r.p, "gender")}</td><td>${r.s.name}<div style="font-size:11px;color:var(--muted)">${r.s.catName}</div></td><td><span class="pill ${r.e.direction}">${r.e.direction}</span></td><td class="score" style="color:${color(r.e.direction)}">${r.e.score > 0 ? "+" : ""}${r.e.score.toFixed(2)}</td><td><span class="tag c-${r.e.llm_confidence}">${r.e.llm_confidence}</span></td><td class="quote" title="${r.e.quote.replace(/"/g, "&quot;")}">“${r.e.quote}”</td></tr>`).join("") || `<tr><td colspan="9" class="empty-state">No legislators match.</td></tr>`}</tbody></table>`;
    wrap.querySelectorAll("th[data-k]").forEach(h => h.onclick = () => { const k = h.dataset.k; if (L.sort === k) L.desc = !L.desc; else { L.sort = k; L.desc = k === "score" || k === "conf"; } renderTable(); });
    wrap.querySelectorAll("tbody tr[data-i]").forEach(tr => tr.onclick = () => { L.sel = rows[+tr.dataset.i].e; renderTable(); renderSide(); });
    $("csv").onclick = csv;
  }
  function renderListSide() {
    const e = state.l.sel;
    $side.innerHTML = e ? `<div class="person-card"><div class="name">${byId[e.from].name}</div><div class="meta">${attr(byId[e.from], "district")} · ${attr(byId[e.from], "party")} · ${attr(byId[e.from], "gender") === "F" ? "Female" : "Male"} · in office since ${attr(byId[e.from], "since")}</div>${evidenceHtml(e, subById[e.to].name)}</div>`
      : `<div class="empty-state">Use the dropdowns to narrow the list, then click a row to read the evidence.</div>`;
  }

  // ---------- left panel ----------
  function renderAside() {
    if (state.mode === "list") return renderListAside();
    if (state.mode === "focus") return renderFocusAside();
    const chip = (cls, id, label, on) => `<span class="chip ${cls} ${on ? "active" : ""}" data-k="${cls}" data-id="${id}">${label}</span>`;
    const groups = TAX.map(c => {
      const subs = c.subs.filter(s => countFor(s.id) > 0);
      const allOn = subs.every(s => state.f.subs.has(s.id)), anyOn = subs.some(s => state.f.subs.has(s.id));
      return `<div class="group">
        <label class="gh"><input type="checkbox" data-cat="${c.id}" ${allOn ? "checked" : ""} ${!allOn && anyOn ? "data-ind=1" : ""}>
          <span class="sw" style="background:${CAT_HUE[c.id]}"></span><span class="name">${c.name}</span><span class="n">${subs.reduce((a, s) => a + countFor(s.id), 0)}</span></label>
        <div class="subs">${subs.map(s => chip("sub", s.id, `${s.name} · ${countFor(s.id)}`, state.f.subs.has(s.id))).join("")}</div>
      </div>`;
    }).join("");
    const fe = filteredEdges();
    $aside.innerHTML = `
      <div class="h" style="margin-top:8px">Search</div>
      <input class="search" id="q" placeholder="legislator or topic…" value="${state.f.q}">
      <div class="h">Topics of interest <a id="all">all</a>&nbsp;<a id="none">none</a></div>
      ${groups}
      <div class="h">Party</div>
      <div class="subs">${chip("d party", "D", "Democrat", state.f.parties.has("D"))}${chip("r party", "R", "Republican", state.f.parties.has("R"))}</div>
      <div class="h">Stance</div>
      <div class="subs">${["support", "oppose", "neutral"].map(d => chip(d + " dir", d, d, state.f.dirs.has(d))).join("")}</div>
      <div class="h">Min. LLM confidence</div>
      <div class="subs">${CONF.map((c, i) => chip("conf", i, c, state.f.minConf === i)).join("")}</div>
      <div class="stat">${fe.length} stances · ${new Set(fe.map(e => e.from)).size} legislators · ${new Set(fe.map(e => e.to)).size} topics</div>`;

    $aside.querySelectorAll("input[data-cat]").forEach(cb => {
      if (cb.dataset.ind) cb.indeterminate = true;
      cb.onchange = () => { const c = TAX.find(c => c.id === cb.dataset.cat); c.subs.forEach(s => cb.checked ? state.f.subs.add(s.id) : state.f.subs.delete(s.id)); render(); };
    });
    $aside.querySelectorAll(".chip").forEach(el => el.onclick = () => {
      const k = el.dataset.k, id = el.dataset.id;
      if (k.includes("sub")) toggle(state.f.subs, id);
      else if (k.includes("party")) toggle(state.f.parties, id);
      else if (k.includes("dir")) toggle(state.f.dirs, id);
      else if (k.includes("conf")) state.f.minConf = +id;
      render();
    });
    $("all").onclick = () => { SUBS.forEach(s => state.f.subs.add(s.id)); render(); };
    $("none").onclick = () => { state.f.subs.clear(); render(); };
    const q = $("q"); q.oninput = () => { state.f.q = q.value; renderGraph(); renderSide(); renderStat(); };
  }
  function renderStat() { const fe = filteredEdges(); const s = $aside.querySelector(".stat"); if (s) s.textContent = `${fe.length} stances · ${new Set(fe.map(e => e.from)).size} legislators · ${new Set(fe.map(e => e.to)).size} topics`; }
  const toggle = (set, v) => set.has(v) ? set.delete(v) : set.add(v);

  function renderFocusAside() {
    const cats = TAX.map(c => `<div class="cat ${state.cat === c.id ? "active" : ""}" data-id="${c.id}"><span>${c.name}</span><span class="n">${c.subs.reduce((a, s) => a + countFor(s.id), 0)}</span></div>`).join("");
    const c = TAX.find(c => c.id === state.cat);
    const subs = c ? c.subs.map(s => { const n = countFor(s.id); return `<span class="chip ${state.sub === s.id ? "active" : ""} ${n ? "" : "empty"}" data-id="${s.id}">${s.name}${n ? ` · ${n}` : ""}</span>`; }).join("") : "";
    $aside.innerHTML = `<div class="h">Category</div>${cats}<div class="h">Sub-category</div><div class="subs">${subs}</div>`;
    $aside.querySelectorAll(".cat").forEach(el => el.onclick = () => { state.cat = el.dataset.id; const f = TAX.find(c => c.id === state.cat).subs.find(s => countFor(s.id) > 0); state.sub = f ? f.id : null; state.person = null; render(); });
    $aside.querySelectorAll(".chip:not(.empty)").forEach(el => el.onclick = () => { state.sub = el.dataset.id; state.person = null; render(); });
  }

  // ---------- right panel ----------
  function renderSide() {
    if (state.mode === "list") return renderListSide();
    if (state.mode === "focus") return renderFocusSide();
    const fe = filteredEdges();
    if (state.person && byId[state.person]) {
      const p = byId[state.person];
      const mine = fe.filter(e => e.from === p.id).sort((a, b) => b.score - a.score);
      const sel = state.edge && mine.find(e => e.to === state.edge) || mine[0];
      $side.innerHTML = `<div class="person-card"><div class="name">${p.name}</div><div class="meta">${attr(p, "district")} · ${attr(p, "party")} · ${mine.length} stances in view</div>
        ${mine.map(e => `<div class="stance-line ${sel === e ? "active" : ""}" data-sub="${e.to}"><div><div class="t">${subById[e.to].name}</div><div class="c">${subById[e.to].catName}</div></div><div class="score" style="color:${color(e.direction)}">${e.score > 0 ? "+" : ""}${e.score.toFixed(2)}</div></div>`).join("")}
        ${sel ? evidenceHtml(sel, subById[sel.to].name) : ""}
        <div style="margin-top:12px"><button class="btn" id="back">← all legislators</button></div></div>`;
      $side.querySelectorAll(".stance-line").forEach(el => el.onclick = () => { state.edge = el.dataset.sub; renderSide(); });
      $("back").onclick = () => { state.person = null; state.edge = null; render(); };
      return;
    }
    // overview: legislators ranked by number of stances in view
    const byP = {};
    fe.forEach(e => (byP[e.from] ??= []).push(e));
    const rows = Object.entries(byP).sort((a, b) => b[1].length - a[1].length).map(([pid, es]) => {
      const p = byId[pid], sup = es.filter(e => e.direction === "support").length, opp = es.filter(e => e.direction === "oppose").length;
      return `<div class="row" data-id="${pid}"><div><div class="name">${p.name}</div><div class="meta">${attr(p, "district")} · ${attr(p, "party")} · <span style="color:var(--support)">${sup} for</span> · <span style="color:var(--oppose)">${opp} against</span></div></div><div class="score">${es.length}</div></div>`;
    }).join("");
    $side.innerHTML = `<h2 class="topic-title">In view</h2><div class="topic-sub">${fe.length} stances across ${Object.keys(byP).length} legislators. Click one to see their positions.</div>${rows || `<div class="empty-state">Nothing matches the filters.</div>`}`;
    $side.querySelectorAll(".row").forEach(el => el.onclick = () => { state.person = el.dataset.id; state.edge = null; render(); });
  }

  function evidenceHtml(e, topicName) {
    return `<div class="evidence"><div style="font-weight:600">${byId[e.from].name} on ${topicName}</div>
      <blockquote>“${e.quote}”</blockquote>
      <div class="tags"><span class="tag" style="color:${color(e.direction)}">${e.direction}</span><span class="tag">linkage: ${e.linkage}</span><span class="tag c-${e.llm_confidence}">confidence: ${e.llm_confidence}</span><span class="tag">${e.model}</span></div>
      <div style="margin-top:8px;font-size:12px;color:var(--muted)">${e.bill}</div><a href="${e.source}" target="_blank" rel="noopener">source ↗</a></div>`;
  }

  function renderFocusSide() {
    const s = subById[state.sub];
    if (!s) { $side.innerHTML = `<div class="empty-state">Choose a category and sub-category.</div>`; return; }
    const edges = EDGES.filter(e => e.to === s.id).sort((a, b) => b.score - a.score);
    const ticks = edges.map(e => `<span class="tick" style="left:${(e.score + 1) / 2 * 100}%;background:${color(e.direction)}"></span>`).join("");
    const rows = edges.map(e => { const p = byId[e.from], pct = Math.abs(e.score) * 50, left = e.score < 0 ? 50 - pct : 50;
      return `<div class="row ${state.person === p.id ? "active" : ""}" data-id="${p.id}"><div><div class="name">${p.name}</div><div class="meta">${attr(p, "district")} · ${attr(p, "party")}</div><div class="bar"><span style="left:${left}%;width:${pct}%;background:${color(e.direction)}"></span></div></div><div class="score" style="color:${color(e.direction)}">${e.score > 0 ? "+" : ""}${e.score.toFixed(2)}</div></div>`; }).join("");
    const sel = state.person && edges.find(e => e.from === state.person);
    $side.innerHTML = `<h2 class="topic-title">${s.name}</h2><div class="topic-sub">${s.catName} · ${edges.length} legislators · CA</div><div class="spectrum">${ticks}</div>${rows}${sel ? evidenceHtml(sel, s.name) : `<div class="empty-state" style="padding-top:10px">Click a legislator to read the quote behind the score.</div>`}`;
    $side.querySelectorAll(".row").forEach(el => el.onclick = () => { state.person = el.dataset.id; render(); });
  }

  // ---------- graph ----------
  const svg = d3.select("#graph"), g = svg.append("g");
  svg.call(d3.zoom().scaleExtent([.3, 3]).on("zoom", ev => g.attr("transform", ev.transform)));
  let sim;
  function buildGraphData() {
    if (state.mode === "focus") {
      const s = subById[state.sub]; if (!s) return { nodes: [], links: [] };
      const edges = EDGES.filter(e => e.to === s.id);
      const persons = [...new Set(edges.map(e => e.from))];
      const other = EDGES.filter(e => e.to !== s.id && persons.includes(e.from));
      const topics = [...new Set(other.map(e => e.to))];
      return {
        nodes: [{ id: s.id, kind: "topic", name: s.name, main: true, cat: s.cat }, ...persons.map(id => ({ id, kind: "person", name: byId[id].name.replace("Rep. ", "") })), ...topics.map(id => ({ id, kind: "topic", name: subById[id].name, main: false, cat: subById[id].cat }))],
        links: [...edges.map(e => ({ source: e.from, target: e.to, e, main: true })), ...other.map(e => ({ source: e.from, target: e.to, e, main: false }))]
      };
    }
    const fe = filteredEdges();
    const persons = [...new Set(fe.map(e => e.from))], topics = [...new Set(fe.map(e => e.to))];
    return {
      nodes: [...topics.map(id => ({ id, kind: "topic", name: subById[id].name, main: true, cat: subById[id].cat })), ...persons.map(id => ({ id, kind: "person", name: byId[id].name.replace("Rep. ", "") }))],
      links: fe.map(e => ({ source: e.from, target: e.to, e, main: true }))
    };
  }

  function renderGraph() {
    const list = state.mode === "list";
    $("table-wrap").style.display = list ? "block" : "none";
    svg.style("display", list ? "none" : "block"); $("legend").style.display = list ? "none" : "flex";
    if (list) { sim && sim.stop(); return renderTable(); }
    g.selectAll("*").remove();
    const { nodes, links } = buildGraphData();
    const { width, height } = svg.node().getBoundingClientRect();
    const explore = state.mode === "explore";
    const deg = {}; links.forEach(l => { deg[l.source.id ?? l.source] = (deg[l.source.id ?? l.source] || 0) + 1; deg[l.target.id ?? l.target] = (deg[l.target.id ?? l.target] || 0) + 1; });

    sim && sim.stop();
    sim = d3.forceSimulation(nodes)
      .force("link", d3.forceLink(links).id(d => d.id).distance(l => explore ? 90 : (l.main ? 150 : 110)).strength(l => l.main ? .7 : .25))
      .force("charge", d3.forceManyBody().strength(explore ? -260 : -380))
      .force("center", d3.forceCenter(width / 2, height / 2))
      .force("collide", d3.forceCollide(d => d.kind === "topic" ? 40 : 22));

    const link = g.append("g").selectAll("line").data(links).join("line")
      .attr("stroke", d => color(d.e.direction)).attr("stroke-width", d => lw[d.e.linkage]).attr("stroke-opacity", d => d.main ? .7 : .2);

    const node = g.append("g").selectAll("g").data(nodes).join("g").style("cursor", "pointer")
      .call(d3.drag().on("start", (ev, d) => { if (!ev.active) sim.alphaTarget(.3).restart(); d.fx = d.x; d.fy = d.y; })
        .on("drag", (ev, d) => { d.fx = ev.x; d.fy = ev.y; }).on("end", (ev, d) => { if (!ev.active) sim.alphaTarget(0); d.fx = null; d.fy = null; }))
      .on("click", (ev, d) => {
        if (d.kind === "person") { state.person = d.id; state.edge = null; render(); }
        else if (explore) { state.mode = "focus"; state.cat = d.cat; state.sub = d.id; state.person = null; render(); }
        else if (!d.main) { state.cat = d.cat; state.sub = d.id; state.person = null; render(); }
      })
      .on("mouseenter", (ev, d) => highlight(d)).on("mouseleave", () => highlight(null));

    node.filter(d => d.kind === "topic").append("circle")
      .attr("r", d => explore ? 14 + Math.min(16, (deg[d.id] || 0) * 2) : 18)
      .attr("fill", d => d.main ? CAT_HUE[d.cat] : "#2a2f3a").attr("fill-opacity", d => d.main ? .9 : 1)
      .attr("stroke", d => d.main ? "#fff" : "#3b4150").attr("stroke-width", 1.5);
    node.filter(d => d.kind === "person").append("circle")
      .attr("r", d => state.person === d.id ? 14 : 9)
      .attr("fill", d => { if (explore) return attr(byId[d.id], "party") === "D" ? "#3b82f6" : "#f87171"; const e = links.find(l => l.main && (l.source.id ?? l.source) === d.id); return e ? color(e.e.direction) : "#9ca3af"; })
      .attr("stroke", d => state.person === d.id ? "#fff" : "#0f1115").attr("stroke-width", 2);
    node.append("text").attr("class", d => "node-label" + (d.kind === "topic" ? " topic" : "")).attr("text-anchor", "middle")
      .attr("dy", d => d.kind === "topic" ? (explore ? 36 : 5) : 22).text(d => d.name);

    function highlight(d) {
      if (!d) { node.attr("opacity", 1); link.attr("stroke-opacity", l => l.main ? .7 : .2); return; }
      const near = new Set([d.id]); links.forEach(l => { if (l.source.id === d.id) near.add(l.target.id); if (l.target.id === d.id) near.add(l.source.id); });
      node.attr("opacity", n => near.has(n.id) ? 1 : .15);
      link.attr("stroke-opacity", l => l.source.id === d.id || l.target.id === d.id ? .95 : .05);
    }
    sim.on("tick", () => { link.attr("x1", d => d.source.x).attr("y1", d => d.source.y).attr("x2", d => d.target.x).attr("y2", d => d.target.y); node.attr("transform", d => `translate(${d.x},${d.y})`); });
  }

  function renderHeader() {
    $("m-explore").classList.toggle("active", state.mode === "explore");
    $("m-focus").classList.toggle("active", state.mode === "focus");
    $("m-list").classList.toggle("active", state.mode === "list");
    if (state.mode === "list") { $crumb.innerHTML = `<b>Legislator list</b> · dropdown filters`; $hint.textContent = ""; }
    else if (state.mode === "explore") { $crumb.innerHTML = `<b>All topics</b> · filtered view`; $hint.textContent = "Tick topics on the left to filter · hover to see connections · click a topic to focus · click a legislator for evidence"; }
    else { const s = subById[state.sub]; $crumb.innerHTML = s ? `<b>${s.catName}</b> › <b>${s.name}</b>` : "Pick a category"; $hint.textContent = "Drag nodes · click a legislator for evidence · grey topics = what these legislators also talk about"; }
  }
  function render() { renderHeader(); renderAside(); renderSide(); renderGraph(); }
  $("m-explore").onclick = () => { state.mode = "explore"; state.person = null; render(); };
  $("m-focus").onclick = () => { state.mode = "focus"; state.person = null; render(); };
  $("m-list").onclick = () => { state.mode = "list"; state.person = null; render(); };
  render();
  window.addEventListener("resize", renderGraph);
})();
</script>
</body>
</html>
